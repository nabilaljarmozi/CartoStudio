<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CartoStudio</title>
<style>
/* ============================================================================
   CartoStudio — single-file design-time cartography tool.
   All styling lives here; the map itself is styled through inline SVG
   attributes so the export pipeline stays faithful without a stylesheet.
   ========================================================================== */
:root{
  --bg:#eef0f4; --panel:#ffffff; --panel-2:#f7f8fa; --ink:#1d2129; --ink-2:#5a6472;
  --line:#dde1e8; --accent:#2f6fed; --accent-soft:#e8eefc; --danger:#c0392b;
  --ok:#1e8f5a; --warn:#b7791f; --radius:7px;
  --side-w:340px; --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.45 var(--font);color:var(--ink);background:var(--bg);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:600}

#app{display:flex;flex-direction:column;height:100%}

/* ---- top bar --------------------------------------------------------- */
#topbar{display:flex;align-items:center;gap:10px;height:46px;padding:0 12px;
  background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;z-index:40}
#topbar .brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.2px}
#topbar .brand svg{display:block}
#topbar .brand small{font-weight:400;color:var(--ink-2);letter-spacing:0}
#topbar .spacer{flex:1}
.tb-btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);
  background:var(--panel);border-radius:var(--radius);white-space:nowrap}
.tb-btn:hover{background:var(--panel-2)}
.tb-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tb-btn.primary:hover{filter:brightness(1.07)}
.tb-btn[disabled]{opacity:.45;cursor:not-allowed}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:34px;min-width:230px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:0 8px 28px rgba(20,30,50,.16);padding:6px;display:none;z-index:60}
.menu.open{display:block}
.menu button, .menu label.mi{display:flex;width:100%;align-items:center;gap:8px;padding:7px 9px;border:0;background:none;
  border-radius:5px;text-align:left}
.menu button:hover,.menu label.mi:hover{background:var(--accent-soft)}
.menu .sep{height:1px;background:var(--line);margin:5px 2px}
.menu .grp{padding:6px 9px 3px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-2)}
.menu .row{display:flex;gap:6px;padding:4px 9px 8px;align-items:center}
.menu .row select,.menu .row input{flex:1;min-width:0}

/* ---- layout ---------------------------------------------------------- */
#body{flex:1;display:flex;min-height:0}
#stage{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}
#canvasWrap{flex:1;position:relative;overflow:hidden;background:
  linear-gradient(45deg,#e6e9ef 25%,transparent 25%,transparent 75%,#e6e9ef 75%),
  linear-gradient(45deg,#e6e9ef 25%,transparent 25%,transparent 75%,#e6e9ef 75%);
  background-size:18px 18px;background-position:0 0,9px 9px;background-color:#f2f4f7}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#overlay{position:absolute;inset:0;pointer-events:none}
#overlay > *{pointer-events:auto}

/* empty state */
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
  gap:14px;text-align:center;color:var(--ink-2);padding:24px}
#empty h2{font-size:19px;color:var(--ink)}
#empty p{max-width:430px;margin:0}
#empty .drop{border:2px dashed var(--line);border-radius:12px;padding:26px 32px;background:rgba(255,255,255,.72)}
#canvasWrap.dragover .drop{border-color:var(--accent);background:var(--accent-soft)}

/* drill / nav bar on canvas */
.cs-topbar-map{position:absolute;left:12px;top:12px;display:flex;gap:6px;align-items:center;
  background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:var(--radius);
  padding:4px;box-shadow:0 2px 8px rgba(20,30,50,.1)}
.cs-topbar-map button{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;border:0;
  background:none;border-radius:5px}
.cs-topbar-map button:hover:not([disabled]){background:var(--accent-soft)}
.cs-topbar-map button[disabled]{opacity:.35;cursor:default}
.cs-topbar-map .title{padding:0 8px 0 4px;font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs-topbar-map.small button{height:22px;padding:0 5px}
.cs-topbar-map.small .title{font-size:12px;max-width:120px}

/* zoom cluster */
.cs-controls{position:absolute;display:flex;flex-direction:column;gap:4px}
.cs-controls[data-pos="topRight"]{right:12px;top:12px}
.cs-controls[data-pos="topLeft"]{left:12px;top:56px}
.cs-controls[data-pos="bottomRight"]{right:12px;bottom:12px}
.cs-controls[data-pos="bottomLeft"]{left:12px;bottom:12px}
.cs-controls button{width:28px;height:28px;border:1px solid var(--line);background:rgba(255,255,255,.95);
  border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;padding:0}
.cs-controls button:hover{background:var(--accent-soft)}
.cs-pan-row{display:flex;gap:4px;justify-content:center}

/* status toast */
#toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#1d2129;color:#fff;
  padding:9px 14px;border-radius:8px;box-shadow:0 6px 22px rgba(0,0,0,.28);opacity:0;transition:opacity .18s;
  max-width:70%;font-size:12.5px}
#toast.show{opacity:1}
#toast.err{background:var(--danger)}

/* map tooltip */
#tip{position:absolute;pointer-events:none;background:rgba(29,33,41,.95);color:#fff;border-radius:6px;
  padding:7px 9px;font-size:12px;max-width:260px;opacity:0;transition:opacity .1s;z-index:30;line-height:1.4}
#tip.show{opacity:1}
#tip b{display:block;margin-bottom:3px;font-size:12.5px}
#tip .r{display:flex;justify-content:space-between;gap:12px;color:#d8dbe2}
#tip .r span:last-child{color:#fff;font-variant-numeric:tabular-nums}

/* ---- side panel ------------------------------------------------------ */
#side{width:var(--side-w);flex:0 0 var(--side-w);background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
#side.collapsed{width:0;flex-basis:0;overflow:hidden;border-left:0}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:0 0 auto}
.tabs button{flex:1;height:36px;border:0;background:none;color:var(--ink-2);font-weight:600;
  border-bottom:2px solid transparent}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-soft)}
.panel{flex:1;overflow:auto;padding:10px;display:none}
.panel.on{display:block}
.panel::-webkit-scrollbar{width:10px}
.panel::-webkit-scrollbar-thumb{background:#c8cdd6;border-radius:6px;border:3px solid var(--panel)}

/* accordion card */
.card{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;background:var(--panel)}
.card > .head{display:flex;align-items:center;gap:8px;padding:9px 10px;background:var(--panel-2);
  cursor:pointer;user-select:none}
.card > .head .n{width:20px;height:20px;flex:0 0 20px;border-radius:5px;background:#dfe4ec;color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.card > .head .t{flex:1;font-weight:600}
.card > .head .chev{transition:transform .16s;color:var(--ink-2)}
.card.open > .head .chev{transform:rotate(90deg)}
.card.open > .head{background:var(--accent-soft)}
.card > .body{display:none;padding:8px 10px 10px}
.card.open > .body{display:block}
.card .lyr-on{width:8px;height:8px;border-radius:50%;background:#c6ccd6}
.card .lyr-on.on{background:var(--ok)}

/* rows */
.row{display:flex;align-items:center;gap:8px;padding:4px 0;min-height:28px}
.row.hide{display:none}
.row > label{flex:1;color:var(--ink-2);font-size:12.2px;min-width:0}
.row > .ctl{flex:0 0 132px;display:flex;justify-content:flex-end;align-items:center;gap:6px}
.row.stack{flex-direction:column;align-items:stretch;gap:4px}
.row.stack > .ctl{flex:1 1 auto;justify-content:stretch}
.row.stack > .ctl > *{flex:1}
.sub{font-size:11.5px;color:var(--ink-2);margin:6px 0 2px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.row .info{font-size:12px;color:var(--ink);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.info{color:var(--accent);text-decoration:none}
a.info:hover{text-decoration:underline}
.hint{font-size:11.5px;color:var(--ink-2);margin:2px 0 6px}
#empty .credit{font-size:12px;color:var(--ink-2)}
#empty .credit a{color:var(--accent);text-decoration:none}
#empty .credit a:hover{text-decoration:underline}
.hint.warn{color:var(--warn)}
.hint.err{color:var(--danger)}

input[type=text],input[type=number],select,textarea{width:100%;height:27px;padding:0 7px;border:1px solid var(--line);
  border-radius:5px;background:var(--panel);min-width:0}
textarea{height:auto;padding:6px 7px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
input[type=color]{width:34px;height:26px;padding:1px;border:1px solid var(--line);border-radius:5px;background:var(--panel)}
input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:26px}

/* toggle switch */
.sw{position:relative;width:34px;height:19px;flex:0 0 34px;border-radius:11px;background:#c8cdd6;transition:background .15s}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw i{position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:left .15s;
  box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw.on{background:var(--accent)}
.sw.on i{left:17px}

/* data panel bits */
.grp{border:1px solid var(--line);border-radius:var(--radius);padding:10px;margin-bottom:9px}
.grp > h4{font-size:12.5px;margin-bottom:7px;display:flex;align-items:center;gap:7px}
.grp > h4 .badge{margin-left:auto;font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:20px;
  background:#e6e9ef;color:var(--ink-2)}
.grp > h4 .badge.ok{background:#dff3e8;color:var(--ok)}
.filebtn{display:block;border:1.5px dashed var(--line);border-radius:6px;padding:10px;text-align:center;
  color:var(--ink-2);cursor:pointer;background:var(--panel-2);font-size:12.2px}
.filebtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.filebtn input{display:none}
.filename{display:flex;align-items:center;gap:6px;font-size:12px;padding:5px 0;color:var(--ink)}
.filename .x{margin-left:auto;border:0;background:none;color:var(--ink-2);padding:2px 5px;border-radius:4px}
.filename .x:hover{background:#f0d5d2;color:var(--danger)}
.tag{display:inline-block;font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:4px;
  padding:1px 6px;margin:2px 3px 0 0}
table.mini{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px}
table.mini th,table.mini td{border-bottom:1px solid var(--line);padding:3px 4px;text-align:left;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px}
table.mini th{color:var(--ink-2);font-weight:600}
.rolegrid{display:grid;grid-template-columns:1fr 118px;gap:5px 7px;align-items:center;margin-top:4px}
.rolegrid > span{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rolegrid > span code{background:var(--panel-2);padding:1px 4px;border-radius:3px;font-size:11px}
.joinstat{display:flex;gap:6px;align-items:center;font-size:12px;padding:6px 8px;border-radius:5px;margin-top:7px}
.joinstat.ok{background:#dff3e8;color:#16603c}
.joinstat.bad{background:#fbe3e0;color:#8c2f22}
.joinstat.none{background:var(--panel-2);color:var(--ink-2)}

/* modal */
#modalBack{position:fixed;inset:0;background:rgba(16,20,28,.5);display:none;align-items:center;justify-content:center;z-index:100}
#modalBack.open{display:flex}
.modal{background:var(--panel);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.32);width:min(560px,92vw);
  max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.modal header{padding:13px 16px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center;gap:8px}
.modal .content{padding:14px 16px;overflow:auto}
.modal footer{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--panel-2)}
.modal .row > .ctl{flex:0 0 180px}

/* sheet picker */
.sheet-list{display:flex;flex-direction:column;gap:6px}
.sheet-pick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;
  border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:9px 11px;text-align:left}
.sheet-pick:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.sheet-pick b{font-size:13px}
.sheet-pick span{font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.sheet-pick[disabled]{opacity:.5;cursor:not-allowed}

/* share dialog */
.share-out{width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
  word-break:break-all;background:var(--panel-2)}
.share-meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-2);margin:5px 0 12px}
.share-meta .bar{flex:1;height:5px;border-radius:3px;background:#e2e6ec;overflow:hidden}
.share-meta .bar i{display:block;height:100%;background:var(--ok);transition:width .2s}
.share-meta.warn .bar i{background:var(--warn)} .share-meta.warn{color:var(--warn)}
.share-meta.bad .bar i{background:var(--danger)} .share-meta.bad{color:var(--danger)}
.share-tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.share-tabs button{border:0;background:none;padding:7px 12px;border-bottom:2px solid transparent;
  color:var(--ink-2);font-weight:600;border-radius:0}
.share-tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.share-pane{display:none} .share-pane.on{display:block}

/* view-only mode — embeds and standalone files: the app is just the map */
body.view-only #topbar,body.view-only #side{display:none}
body.view-only #canvasWrap{background:none}
.embed-credit{position:absolute;right:8px;bottom:6px;font-size:10.5px;background:rgba(255,255,255,.86);
  border:1px solid var(--line);border-radius:4px;padding:2px 7px;color:var(--ink-2);text-decoration:none;
  z-index:20;line-height:1.5}
.embed-credit:hover{color:var(--accent)}

@media (max-width:900px){ :root{--side-w:300px} }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <span class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2f6fed" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6.5v13L9 17l6 2.5 6-2.5v-13L15 7 9 4z"/>
        <path d="M9 4v13M15 7v12.5"/></svg>
      CartoStudio <small>design-time cartography</small>
    </span>
    <span class="spacer"></span>
    <button class="tb-btn" id="btnUndo" title="Undo formatting change (Ctrl+Z)" disabled>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3 13a9 9 0 1 0 3-7.7L3 8"/></svg>
    </button>
    <button class="tb-btn" id="btnRedo" title="Redo formatting change (Ctrl+Shift+Z)" disabled>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M21 13a9 9 0 1 1-3-7.7L21 8"/></svg>
    </button>
    <div class="menu-wrap">
      <button class="tb-btn" id="btnProject">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        Project
      </button>
      <div class="menu" id="menuProject">
        <button data-act="save-json">Save project (.json)</button>
        <label class="mi">Open project (.json)<input type="file" accept=".json,application/json" id="fileProject" hidden></label>
        <div class="sep"></div>
        <button data-act="share">Share / embed…</button>
        <button data-act="adopt" id="miAdopt" hidden>Keep this map in my workspace</button>
        <button data-act="theme">Apply preset theme…</button>
        <div class="sep"></div>
        <button data-act="reset-fmt">Reset formatting to defaults</button>
        <button data-act="reset-all">Clear everything</button>
      </div>
    </div>
    <button class="tb-btn" id="btnShare">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/>
        <circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
      Share
    </button>
    <div class="menu-wrap">
      <button class="tb-btn primary" id="btnExport">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
          stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 20h16"/></svg>
        Export
      </button>
      <div class="menu" id="menuExport">
        <div class="grp">Vector</div>
        <button data-act="svg">Download SVG</button>
        <div class="grp">Raster</div>
        <div class="row"><label for="pngScale" style="flex:1;font-size:12px;color:var(--ink-2)">Scale</label>
          <select id="pngScale" style="flex:0 0 90px"><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option></select></div>
        <button data-act="png">Download PNG</button>
        <div class="grp">Print</div>
        <div class="row"><label style="flex:1;font-size:12px;color:var(--ink-2)">Paper</label>
          <select id="pdfPaper" style="flex:0 0 90px">
            <option value="a5">A5</option><option value="a4" selected>A4</option><option value="a3">A3</option>
            <option value="letter">Letter</option><option value="legal">Legal</option><option value="tabloid">Tabloid</option>
          </select></div>
        <div class="row"><label style="flex:1;font-size:12px;color:var(--ink-2)">Orientation</label>
          <select id="pdfOrient" style="flex:0 0 90px"><option value="landscape" selected>Landscape</option><option value="portrait">Portrait</option></select></div>
        <label class="mi" style="font-size:12px"><input type="checkbox" id="pdfLegendPage"> Add legend page</label>
        <button data-act="pdf">Download PDF</button>
      </div>
    </div>
    <button class="tb-btn" id="btnSide" title="Show / hide the side panel">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round"><path d="M3 5h18v14H3z"/><path d="M15 5v14"/></svg>
    </button>
  </header>

  <div id="body">
    <main id="stage">
      <div id="canvasWrap">
        <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="overlay"></div>
        <div id="tip"></div>
        <div id="empty">
          <div class="drop">
            <h2>Start with your own geometry</h2>
            <p>Drop a GeoJSON / TopoJSON file here, or use the <b>Data</b> panel on the right.
               CartoStudio ships with no boundaries — every layer comes from your uploads.</p>
          </div>
          <p class="credit">CartoStudio — by <b>Nabil ALJARMOZI</b> ·
            <a href="https://www.linkedin.com/in/nabilaljarmozi/" target="_blank"
               rel="noreferrer noopener">LinkedIn</a></p>
        </div>
        <div id="toast"></div>
      </div>
    </main>
    <aside id="side">
      <div class="tabs">
        <button data-tab="data" class="on">Data</button>
        <button data-tab="format">Format</button>
      </div>
      <div class="panel on" id="panelData"></div>
      <div class="panel" id="panelFormat"></div>
    </aside>
  </div>
</div>

<div id="modalBack"><div class="modal">
  <header id="modalTitle">Title</header>
  <div class="content" id="modalBody"></div>
  <footer id="modalFoot"></footer>
</div></div>

<script type="module">
/* ============================================================================
 * CartoStudio
 * A design-time cartography tool: bring your own geometry + your own table,
 * join them, style the result, export print-ready SVG / PNG / PDF.
 *
 * Algorithms ported from the AdminCartograph Power BI custom visual
 * (github.com/nabilaljarmozi/AdminCartograph, branch `base`) — classification,
 * winding rewind, label placement, glyph geometry, the five-legend container,
 * and the latitude-aware scale bar all follow that implementation.
 * ==========================================================================*/

/* ---------------------------------------------------------------- deps ---- */
const CDN = ['https://esm.sh', 'https://cdn.jsdelivr.net/npm'];
let d3geo, d3poly, topojson, polylabel, Papa;

async function loadDeps() {
  const tryHost = async (host) => {
    const j = (p) => host.includes('jsdelivr') ? `${host}/${p}/+esm` : `${host}/${p}`;
    return Promise.all([
      import(/* @vite-ignore */ j('d3-geo@3')),
      import(/* @vite-ignore */ j('d3-polygon@3')),
      import(/* @vite-ignore */ j('topojson-client@3')),
      import(/* @vite-ignore */ j('polylabel@1.1.0')),
      import(/* @vite-ignore */ j('papaparse@5.4.1'))
    ]);
  };
  let mods = null, lastErr = null;
  for (const host of CDN) {
    try { mods = await tryHost(host); break; } catch (e) { lastErr = e; }
  }
  if (!mods) throw lastErr || new Error('Could not reach any CDN');
  [d3geo, d3poly, topojson] = mods;
  polylabel = mods[3].default || mods[3];
  Papa = mods[4].default || mods[4];
}

/* Lazily loaded, only when the user actually exports / uploads that format. */
let _jspdf = null, _xlsx = null;
async function getJsPDF() {
  if (_jspdf) return _jspdf;
  for (const host of CDN) {
    try {
      const m = await import(/* @vite-ignore */ host.includes('jsdelivr')
        ? `${host}/jspdf@2.5.2/+esm` : `${host}/jspdf@2.5.2`);
      _jspdf = m.jsPDF || m.default?.jsPDF || m.default;
      if (_jspdf) return _jspdf;
    } catch (e) { /* try next host */ }
  }
  throw new Error('Could not load jsPDF from a CDN');
}
async function getXLSX() {
  if (_xlsx) return _xlsx;
  for (const host of CDN) {
    try {
      const m = await import(/* @vite-ignore */ host.includes('jsdelivr')
        ? `${host}/xlsx@0.18.5/+esm` : `${host}/xlsx@0.18.5`);
      _xlsx = m.default && m.default.read ? m.default : m;
      if (_xlsx?.read) return _xlsx;
    } catch (e) { /* try next host */ }
  }
  throw new Error('Could not load the XLSX reader from a CDN');
}

const SVGNS = 'http://www.w3.org/2000/svg';
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null) n.append(kid);
  return n;
};
const sel = (tag, attrs = {}) => {
  const n = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) if (v != null) n.setAttribute(k, String(v));
  return n;
};
const clear = (node) => { while (node && node.firstChild) node.removeChild(node.firstChild); return node; };
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const debounce = (fn, ms = 120) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/** Join-key normalisation — uppercase, drop whitespace / dashes / underscores.
 *  Mirrors `normPcode` in the AdminCartograph visual so "SD-01", "sd_01" and
 *  "SD01" all collide onto the same bucket. */
const normKey = (s) => (s == null ? '' : String(s).trim().toUpperCase().replace(/[\s_\-]+/g, ''));

const isNum = (v) => v != null && v !== '' && Number.isFinite(Number(v));
const toNum = (v) => (isNum(v) ? Number(v) : null);

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: filename });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

let toastTimer = null;
function toast(msg, isErr = false) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), isErr ? 6000 : 3200);
}

/** Number formatting for labels + legends (port of render/format.ts). */
function fmtNumber(value, decimals, mode) {
  if (value == null || !Number.isFinite(value)) return '';
  const d = clamp(decimals | 0, 0, 6);
  const scaled = (div, suf) => `${(value / div).toFixed(d)}${suf}`;
  switch (mode) {
    case 'thousands': return scaled(1e3, 'K');
    case 'millions': return scaled(1e6, 'M');
    case 'percent': return `${(value * 100).toFixed(d)}%`;
    default:
      if (Math.abs(value) >= 1e9) return scaled(1e9, 'B');
      if (Math.abs(value) >= 1e6) return scaled(1e6, 'M');
      if (Math.abs(value) >= 1e3) return scaled(1e3, 'K');
      return value.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
  }
}

function parseHex(hex) {
  if (!hex) return null;
  const m = String(hex).replace(/^#/, '');
  if (m.length === 3) return { r: parseInt(m[0] + m[0], 16), g: parseInt(m[1] + m[1], 16), b: parseInt(m[2] + m[2], 16) };
  if (m.length === 6) return { r: parseInt(m.slice(0, 2), 16), g: parseInt(m.slice(2, 4), 16), b: parseInt(m.slice(4, 6), 16) };
  return null;
}
const toHex = (r, g, b) => '#' + [r, g, b].map((n) => clamp(Math.round(n), 0, 255).toString(16).padStart(2, '0')).join('');

/** White → base sequential ramp (port of classification.ts `rampColors`). */
function rampColors(baseColor, n) {
  const base = parseHex(baseColor) || { r: 31, g: 119, b: 180 };
  const out = [];
  for (let i = 0; i < n; i++) {
    const t = n === 1 ? 1 : (i + 1) / n;   // skip pure white at index 0
    out.push(toHex(255 + (base.r - 255) * t, 255 + (base.g - 255) * t, 255 + (base.b - 255) * t));
  }
  return out;
}

/**
 * RFC-7946 → d3-geo rewind.
 *
 * d3-geo uses the spherical right-hand rule: a polygon's interior must lie to
 * the RIGHT of the direction of travel, which in lon/lat means outer rings run
 * CLOCKWISE and holes counter-clockwise. RFC 7946 (what almost every modern
 * exporter emits) says the opposite. Feeding a CCW outer ring to d3.geoPath
 * makes it the COMPLEMENT of the region — the whole sphere minus the polygon —
 * which renders as one solid fill with a pinhole. Every upload goes through
 * here first. Port of src/geo/winding.ts.
 */
function rewindRing(ring, targetCCW) {
  if (!Array.isArray(ring) || ring.length < 4) return false;
  let sum = 0;
  for (let i = 0; i < ring.length - 1; i++) sum += ring[i][0] * ring[i + 1][1] - ring[i + 1][0] * ring[i][1];
  const isCCW = sum > 0;
  if (isCCW === targetCCW) return false;
  ring.reverse();
  return true;
}
function rewindPolygon(polygon) {
  if (!Array.isArray(polygon) || !polygon.length) return 0;
  let n = 0;
  if (rewindRing(polygon[0], false)) n++;              // outer → CW
  for (let i = 1; i < polygon.length; i++) if (rewindRing(polygon[i], true)) n++;  // holes → CCW
  return n;
}
function rewindGeometry(g) {
  if (!g || typeof g !== 'object') return 0;
  if (g.type === 'Polygon') return rewindPolygon(g.coordinates);
  if (g.type === 'MultiPolygon') return g.coordinates.reduce((a, p) => a + rewindPolygon(p), 0);
  if (g.type === 'GeometryCollection' && Array.isArray(g.geometries)) {
    return g.geometries.reduce((a, inner) => a + rewindGeometry(inner), 0);
  }
  return 0;
}
function rewindFeatureCollection(fc) {
  let flipped = 0;
  for (const f of (fc?.features || [])) if (f?.geometry) flipped += rewindGeometry(f.geometry);
  return flipped;
}

/** Accepts GeoJSON (FeatureCollection / Feature / bare geometry) or TopoJSON. */
function parseGeometryText(text, filename) {
  let parsed;
  try { parsed = JSON.parse(text); }
  catch (e) { throw new Error(`${filename} is not valid JSON (${(e.message || '').slice(0, 90)})`); }
  return normaliseToFC(parsed, filename);
}

function normaliseToFC(parsed, filename) {
  if (!parsed || typeof parsed !== 'object') throw new Error(`${filename} did not contain an object`);

  // TopoJSON — decode every object in the topology and merge the features.
  if (parsed.type === 'Topology') {
    if (!parsed.objects || !Object.keys(parsed.objects).length) {
      throw new Error(`${filename} is a TopoJSON topology with no objects`);
    }
    const feats = [];
    for (const name of Object.keys(parsed.objects)) {
      const fc = topojson.feature(parsed, parsed.objects[name]);
      if (fc.type === 'FeatureCollection') feats.push(...fc.features);
      else feats.push(fc);
    }
    if (!feats.length) throw new Error(`${filename} decoded to zero features`);
    return { type: 'FeatureCollection', features: feats };
  }

  let fc = null;
  if (parsed.type === 'FeatureCollection' && Array.isArray(parsed.features)) fc = parsed;
  else if (parsed.type === 'Feature') fc = { type: 'FeatureCollection', features: [parsed] };
  else if (['Polygon', 'MultiPolygon', 'GeometryCollection'].includes(parsed.type)) {
    fc = { type: 'FeatureCollection', features: [{ type: 'Feature', properties: {}, geometry: parsed }] };
  }
  if (!fc) throw new Error(`${filename}: expected a GeoJSON FeatureCollection or a TopoJSON Topology, got "${parsed.type || typeof parsed}"`);

  fc.features = fc.features.filter((f) => f && f.geometry &&
    ['Polygon', 'MultiPolygon'].includes(f.geometry.type));
  if (!fc.features.length) throw new Error(`${filename} has no Polygon / MultiPolygon features`);
  for (const f of fc.features) if (!f.properties) f.properties = {};
  return fc;
}

/** Union of property names across the first 50 features (some exporters put
 *  different keys on different rows). */
function collectPropertyNames(fc) {
  const seen = new Set();
  for (const f of (fc.features || []).slice(0, 50)) {
    for (const k of Object.keys(f.properties || {})) seen.add(k);
  }
  return Array.from(seen);
}

const GUESS_PATTERNS = {

    /^state[_-]?name$/i, /^state$/i, /^province$/i, /^region$/i, /^shapename$/i, /^name$/i],
  adm2Pcode: [/^adm2[_-]?pcode$/i, /^pcode[_-]?2$/i, /^adm2[_-]?code$/i, /^admin2[_-]?(p)?code$/i,
    /^gid[_-]?2$/i, /^county[_-]?id$/i, /^id[_-]?2$/i],
  adm2Name: [/^adm2[_-]?en$/i, /^name[_-]?2$/i, /^adm2[_-]?name$/i, /^admin2[_-]?name$/i,
    /^locality[_-]?name$/i, /^district$/i, /^county$/i, /^name$/i]
};
function guessField(names, role) {
  for (const re of GUESS_PATTERNS[role]) {
    const hit = names.find((n) => re.test(n));
    if (hit) return hit;

}

/**
 * Copy the user's chosen property values onto the canonical keys the renderer
 * uses (ADM1_PCODE / ADM1_EN / ADM2_PCODE / ADM2_EN). Original properties are
 * kept so tooltips and the "join by any field" dropdown can still reach them.
 */
function applyMapping(fc, level, mapping) {
  invalidateAreas();
  const pairs = level === 1
    ? [['ADM1_PCODE', mapping.adm1Pcode], ['ADM1_EN', mapping.adm1Name]]
    : [['ADM1_PCODE', mapping.adm2Parent || mapping.adm1Pcode], ['ADM2_PCODE', mapping.adm2Pcode],
       ['ADM2_EN', mapping.adm2Name]];
  for (const f of fc.features) {
    const p = f.properties || (f.properties = {});
    // Snapshot before clearing so mapping a canonical name onto itself
    // (ADM1_PCODE → ADM1_PCODE) still works.
    const snapshot = pairs.map(([, src]) => (src ? p[src] : undefined));
    for (const [target] of pairs) delete p[target];
    pairs.forEach(([target], i) => {
      const v = snapshot[i];
      if (v != null && v !== '') p[target] = String(v);
    });
  }
}

/** Options for the Admin-N link-field dropdown: every property carried by the
 *  uploaded geometry at that level, PCODE first. */
function linkFieldOptions(level) {
  const props = level === 1 ? state.geom.adm1Props : state.geom.adm2Props;
  const canonical = level === 1 ? ['ADM1_PCODE', 'ADM1_EN'] : ['ADM2_PCODE', 'ADM2_EN'];
  const rest = props.filter((p) => !canonical.includes(p));
  return [...canonical, ...rest].map((p) => [p, p === canonical[0] ? `${p} (join key)` :
    p === canonical[1] ? `${p} (name)` : p]);
}

/** Alias → canonical PCODE for the chosen link field. Keys are normalised so
 *  minor formatting differences still match (port of buildLinkMaps). */
function buildLinkMap(fc, linkField, pcodeKey) {
  const m = new Map();
  if (!fc || !linkField || linkField === pcodeKey) return m;
  for (const f of fc.features) {
    const code = f.properties?.[pcodeKey];
    const key = normKey(f.properties?.[linkField]);
    if (code && key && !m.has(key)) m.set(key, String(code));
  }
  return m;
}

function parseDelimitedText(text, filename) {
  const res = Papa.parse(text.trim(), { header: true, skipEmptyLines: 'greedy', dynamicTyping: false });
  if (!res.data || !res.data.length) throw new Error(`${filename} produced no rows`);
  const columns = (res.meta.fields || Object.keys(res.data[0] || {})).filter((c) => c != null && c !== '');
  if (!columns.length) throw new Error(`${filename} has no header row`);
  return { rows: res.data, columns };
}

/**
 * Ask which sheet to read. Sizes come from each sheet's declared range rather
 * than from parsing it, so naming a sheet costs nothing on a large workbook —
 * only the chosen one is materialised.
 */
function pickSheet(fileName, sheets) {
  return new Promise((resolve) => {
    let settled = false;
    const finish = (v) => { if (!settled) { settled = true; resolve(v); } };
    const list = el('div', { class: 'sheet-list' });
    for (const sheet of sheets) {
      const empty = sheet.rows <= 0;
      list.appendChild(el('button', { class: 'sheet-pick', disabled: empty,
        onclick: () => { finish(sheet.name); closeModal(); } },
        el('b', { text: sheet.name }),
        el('span', { text: empty ? 'empty'
          : `${sheet.rows.toLocaleString()} row${sheet.rows === 1 ? '' : 's'} × ${sheet.cols} column${sheet.cols === 1 ? '' : 's'}` })));
    }
    openModal(`Which sheet from ${fileName}?`, [
      el('p', { class: 'hint', text: 'This workbook has more than one sheet. Pick the one holding your '
        + 'table — its first row is read as the header.' }),
      list
    ], [['Cancel', closeModal, false]], () => finish(null));
  });
}

async function parseWorkbookFile(file) {
  const XLSX = await getXLSX();
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  const names = wb.SheetNames || [];
  if (!names.length) throw new Error(`${file.name} has no sheets`);

  let sheetName = names[0];
  if (names.length > 1) {
    const sized = names.map((name) => {
      const ws = wb.Sheets[name];
      if (!ws || !ws['!ref']) return { name, rows: 0, cols: 0 };
      const r = XLSX.utils.decode_range(ws['!ref']);
      return { name, rows: Math.max(0, r.e.r - r.s.r), cols: r.e.c - r.s.c + 1 };
    });
    if (sized.every((x) => x.rows <= 0)) throw new Error(`Every sheet in ${file.name} is empty`);
    sheetName = await pickSheet(file.name, sized);
    if (!sheetName) return null;   // cancelled — leave the current map alone
  }

  const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: '', raw: false });
  if (!rows.length) throw new Error(`${file.name} → sheet "${sheetName}" is empty`);
  // Name the sheet in the Data panel so it is obvious which one is loaded.
  const label = names.length > 1 ? `${file.name} — ${sheetName}` : file.name;
  return { rows, columns: Object.keys(rows[0]), label };
}

/** Best-effort first pass at the role bindings so a fresh upload already
 *  shows something on the map. Everything is overridable in the Data panel. */
function inferRoles(columns, rows) {
  const roles = { adm1Key: '', adm2Key: '', colorValue: '', bubbleSize: '',
    glyphValues: [], labelValue2: '', labelText1: '', tooltips: [] };
  const numericScore = (col) => {
    let n = 0, total = 0;
    for (const r of rows.slice(0, 60)) { if (r[col] === '' || r[col] == null) continue; total++; if (isNum(r[col])) n++; }
    return total ? n / total : 0;
  };
  const pick = (pats) => columns.find((c) => pats.some((re) => re.test(c)));
  roles.adm1Key = pick([/^adm1[_-]?pcode$/i, /^pcode[_-]?1$/i, /adm1/i, /admin1/i, /state/i, /province/i,
    /governorate/i, /^region$/i]) || '';
  roles.adm2Key = pick([/^adm2[_-]?pcode$/i, /^pcode[_-]?2$/i, /adm2/i, /admin2/i, /district/i, /locality/i, /county/i]) || '';
  if (roles.adm2Key === roles.adm1Key) roles.adm2Key = '';
  // Nothing matched by name: fall back to the first mostly-textual column,
  // which in practice is the area key in hand-made spreadsheets.
  if (!roles.adm1Key && !roles.adm2Key) {
    roles.adm1Key = columns.find((c) => numericScore(c) < 0.3) || '';
  }
  const numeric = columns.filter((c) => c !== roles.adm1Key && c !== roles.adm2Key && numericScore(c) > 0.7);
  if (numeric.length) roles.colorValue = numeric[0];
  return roles;
}

/* ============================================================== the join === */

/**
 * Fold the uploaded table into one AreaDatum per PCODE, resolving the join
 * through the chosen link field. Mirrors dataConverter.prepareDataView +
 * the PCODE-tolerant fallback in visual.ts.
 */
function buildAreas() {
  const { rows, roles } = state.data;
  const g = state.geom;
  const areas = new Map();
  const stats = { matched: 0, unmatched: 0, unmatchedSamples: [], rows: rows.length };
  if (!rows.length || (!roles.adm1Key && !roles.adm2Key)) return { areas, stats };

  const link1 = buildLinkMap(g.adm1, S().general.admin1LinkField, 'ADM1_PCODE');
  const link2 = buildLinkMap(g.adm2, S().general.admin2LinkField, 'ADM2_PCODE');
  // Every canonical code that exists in the geometry, for match reporting.
  const codes1 = new Set((g.adm1?.features || []).map((f) => normKey(f.properties.ADM1_PCODE)).filter(Boolean));
  const codes2 = new Set((g.adm2?.features || []).map((f) => normKey(f.properties.ADM2_PCODE)).filter(Boolean));
  // Admin2 → parent Admin1, used when only the Admin2 key is bound.
  const childToParent = new Map();
  for (const f of (g.adm2?.features || [])) {
    const c = f.properties.ADM2_PCODE, p = f.properties.ADM1_PCODE;
    if (c && p) childToParent.set(normKey(c), String(p));
  }

  const canonical = (raw, map) => {
    if (raw == null || raw === '') return null;
    const k = normKey(raw);
    return map.size ? (map.get(k) || String(raw).trim()) : String(raw).trim();
  };

  for (const row of rows) {
    const a1 = roles.adm1Key ? canonical(row[roles.adm1Key], link1) : null;
    const a2 = roles.adm2Key ? canonical(row[roles.adm2Key], link2) : null;
    const key = a2 || a1;
    if (!key) continue;
    const level = a2 ? 2 : 1;
    const known = level === 2 ? codes2.has(normKey(key)) : codes1.has(normKey(key));
    if (known) stats.matched++;
    else {
      stats.unmatched++;
      if (stats.unmatchedSamples.length < 3) stats.unmatchedSamples.push(String(key));
    }

    const glyphValues = roles.glyphValues.map((c) => toNum(row[c]) ?? 0);
    const tooltips = roles.tooltips.map((c) => ({ label: c, value: row[c] }));
    const datum = {
      pcode: key,
      level,
      parentPcode: level === 2 ? (a1 || childToParent.get(normKey(key)) || null) : key,
      colorValue: roles.colorValue ? toNum(row[roles.colorValue]) : null,
      colorValueRaw: roles.colorValue ? row[roles.colorValue] : null,
      bubbleSize: roles.bubbleSize ? toNum(row[roles.bubbleSize]) : null,
      glyphValues,
      labelValue2: roles.labelValue2 ? toNum(row[roles.labelValue2]) : null,
      labelText1: roles.labelText1 ? (row[roles.labelText1] || null) : null,
      tooltips
    };
    const existing = areas.get(key);
    // Duplicate rows for the same area: sum the measures so pre-aggregated and
    // transaction-level tables both behave. Text fields keep the first value.
    if (existing) {
      const add = (a, b) => (a == null ? b : (b == null ? a : a + b));
      existing.colorValue = add(existing.colorValue, datum.colorValue);
      existing.bubbleSize = add(existing.bubbleSize, datum.bubbleSize);
      existing.labelValue2 = add(existing.labelValue2, datum.labelValue2);
      for (let i = 0; i < glyphValues.length; i++) existing.glyphValues[i] = (existing.glyphValues[i] || 0) + glyphValues[i];
      if (!existing.labelText1) existing.labelText1 = datum.labelText1;
    } else {
      areas.set(key, datum);
    }
  }
  return { areas, stats };
}

/** The join is the one O(rows) step in the render path, so memoise it: dragging
 *  a colour picker must not re-scan a 100k-row table on every frame. */
let _areasCache = null, _areasKey = '';
function getAreas() {
  const key = JSON.stringify([state.data.fileName, state.data.rows.length, state.data.roles,
    S().general.admin1LinkField, S().general.admin2LinkField, state.geom.mapping,
    state.geom.adm1Name, state.geom.adm2Name]);
  if (_areasCache && _areasKey === key) return _areasCache;
  _areasKey = key;
  _areasCache = buildAreas();
  return _areasCache;
}
const invalidateAreas = () => { _areasCache = null; };

/** Roll Admin2 rows up to their parent Admin1 (port of aggregateToStates). */
function aggregateToAdmin1(areas) {
  const childToParent = new Map();
  for (const f of (state.geom.adm2?.features || [])) {
    const c = f.properties.ADM2_PCODE, p = f.properties.ADM1_PCODE;
    if (c && p) childToParent.set(String(c), String(p));
  }
  const acc = new Map();
  for (const a of areas.values()) {
    const key = a.level === 1 ? a.pcode : (a.parentPcode || childToParent.get(a.pcode) || null);
    if (!key) continue;
    if (!acc.has(key)) {
      acc.set(key, { pcode: key, level: 1, parentPcode: key, colorValue: null, colorValueRaw: null,
        bubbleSize: null, glyphValues: [], labelValue2: null, labelText1: null, tooltips: [],
        _tally: new Map(), _tips: new Map() });
    }
    const t = acc.get(key);
    const add = (x, y) => (y == null ? x : (x ?? 0) + y);
    t.colorValue = add(t.colorValue, a.colorValue);
    t.bubbleSize = add(t.bubbleSize, a.bubbleSize);
    t.labelValue2 = add(t.labelValue2, a.labelValue2);
    if (!t.labelText1 && a.labelText1) t.labelText1 = a.labelText1;
    if (a.colorValueRaw != null && a.colorValueRaw !== '') {
      const k = String(a.colorValueRaw);
      t._tally.set(k, (t._tally.get(k) || 0) + 1);
    }
    for (let i = 0; i < a.glyphValues.length; i++) t.glyphValues[i] = (t.glyphValues[i] || 0) + (a.glyphValues[i] || 0);
    for (const tip of a.tooltips) {
      const e = t._tips.get(tip.label) || { sum: null, text: null };
      const n = isNum(String(tip.value).replace(/,/g, '')) ? Number(String(tip.value).replace(/,/g, '')) : NaN;
      if (Number.isFinite(n)) e.sum = (e.sum ?? 0) + n;
      else if (!e.text && tip.value) e.text = tip.value;
      t._tips.set(tip.label, e);
    }
  }
  for (const t of acc.values()) {
    // Categorical roll-up takes the modal child category.
    let best = null, bestN = 0;
    t._tally.forEach((n, k) => { if (n > bestN) { bestN = n; best = k; } });
    t.colorValueRaw = best;
    t.tooltips = Array.from(t._tips, ([label, e]) => ({ label, value: e.sum != null ? e.sum : e.text }));
    delete t._tally; delete t._tips;
  }
  return acc;
}

/* ====================================================== classification ==== */
/* Port of src/render/classification.ts. */

function buildBreaks(values, method, classCount, manualText) {
  const finite = values.filter((v) => Number.isFinite(v));
  if (!finite.length) return { breaks: [], min: 0, max: 0, classCount: 0 };
  const sorted = finite.slice().sort((a, b) => a - b);
  const min = sorted[0], max = sorted[sorted.length - 1];
  const k = clamp(Math.floor(classCount || 5), 2, 7);
  if (min === max) return { breaks: [], min, max, classCount: 1 };

  if (method === 'manual') {
    const parsed = String(manualText || '').split(/[\s,;]+/).map(Number)
      .filter(Number.isFinite).sort((a, b) => a - b);
    if (parsed.length) return { breaks: parsed, min, max, classCount: parsed.length + 1 };
  }
  if (method === 'equal') {
    const step = (max - min) / k;
    const breaks = [];
    for (let i = 1; i < k; i++) breaks.push(min + step * i);
    return { breaks, min, max, classCount: k };
  }
  // quantile — interpolated order statistics, then dedupe (heavily tied data
  // collapses to fewer effective classes and the legend should say so).
  const breaks = [];
  for (let i = 1; i < k; i++) {
    const q = (i / k) * (sorted.length - 1);
    const lo = Math.floor(q), hi = Math.ceil(q);
    breaks.push(lo === hi ? sorted[lo] : sorted[lo] + (sorted[hi] - sorted[lo]) * (q - lo));
  }
  const cleaned = [];
  for (const v of breaks) if (!cleaned.length || v > cleaned[cleaned.length - 1]) cleaned.push(v);
  return { breaks: cleaned, min, max, classCount: cleaned.length + 1 };
}

function classIndex(breaks, value) {
  for (let i = 0; i < breaks.length; i++) if (value < breaks[i]) return i;
  return breaks.length;
}

function makeLegendClasses(breaks, colors) {
  if (breaks.classCount <= 0) return [];
  if (breaks.classCount === 1) return [{ color: colors[0] || '#999999', from: breaks.min, to: breaks.max }];
  const edges = [breaks.min, ...breaks.breaks, breaks.max];
  const out = [];
  for (let i = 0; i < breaks.classCount; i++) {
    out.push({ color: colors[Math.min(colors.length - 1, i)], from: edges[i], to: edges[i + 1] });
  }

}

/* ==================================================== anchors / geometry === */
/* Port of src/render/labelPlacement.ts. */

function ringArea(ring) {
  let a = 0;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    a += (ring[j][0] - ring[i][0]) * (ring[i][1] + ring[j][1]);
  }
  return Math.abs(a / 2);
}

function collectRings(geometry, largestPartOnly, avoidHoles) {
  if (!geometry) return [];
  if (geometry.type === 'Polygon') {
    const rings = geometry.coordinates;
    return avoidHoles ? rings : [rings[0]];
  }
  if (geometry.type === 'MultiPolygon') {
    const polys = geometry.coordinates;
    if (!polys.length) return [];
    let chosen = polys[0];
    if (largestPartOnly) {
      let best = -Infinity;
      for (const p of polys) { const a = ringArea(p[0]); if (a > best) { best = a; chosen = p; } }
    }
    return avoidHoles ? chosen : [chosen[0]];
  }
  return [];
}

/**
 * Area-weighted centroid first — that's what a reader intuits as "the middle"
 * — and polylabel (pole of inaccessibility) only when the centroid falls
 * outside the ring or inside a hole. Keeps elongated states visually centred
 * without breaking L-shaped ones.
 */
function pickAnchor(geometry, { largestPartOnly = true, avoidHoles = true, virtualHoles = null } = {}) {
  const rings = collectRings(geometry, largestPartOnly, avoidHoles);
  if (!rings.length) return null;
  const outer = rings[0];
  if (!outer || outer.length < 3) return null;
  const holes = [...rings.slice(1), ...((virtualHoles || []).filter((r) => r && r.length >= 3))];

  const c = d3poly.polygonCentroid(outer);
  if (Number.isFinite(c[0]) && Number.isFinite(c[1]) &&
      d3poly.polygonContains(outer, c) && !holes.some((h) => d3poly.polygonContains(h, c))) {
    return [c[0], c[1]];
  }
  try {
    const [x, y] = polylabel([outer, ...holes], 1.0);
    if (Number.isFinite(x) && Number.isFinite(y)) return [x, y];
  } catch (e) { /* fall through to the vertex mean */ }
  let sx = 0, sy = 0;
  for (const [x, y] of outer) { sx += x; sy += y; }
  return [sx / outer.length, sy / outer.length];
}

function fitsInside(bbox, anchor, width, height) {
  const [minX, minY, maxX, maxY] = bbox;
  return anchor[0] - width / 2 >= minX && anchor[0] + width / 2 <= maxX &&
         anchor[1] - height / 2 >= minY && anchor[1] + height / 2 <= maxY;
}

function largestProjectedOuterRing(geometry, projection) {
  let candidate = null;
  if (!geometry) return null;
  if (geometry.type === 'Polygon') candidate = geometry.coordinates[0];
  else if (geometry.type === 'MultiPolygon') {
    let best = -Infinity;
    for (const poly of geometry.coordinates) {
      const a = ringArea(poly[0]);
      if (a > best) { best = a; candidate = poly[0]; }
    }
  }
  if (!candidate) return null;
  const out = [];
  for (const c of candidate) { const p = projection(c); if (p) out.push(p); }
  return out;
}

/** PCA on the projected outer ring → the polygon's long-axis angle, clamped
 *  to [-90, 90] so text stays right-side-up. */
function principalAxisAngleDeg(geometry, projection) {
  const ring = largestProjectedOuterRing(geometry, projection);
  if (!ring || ring.length < 3) return 0;
  let mx = 0, my = 0;
  for (const [x, y] of ring) { mx += x; my += y; }
  mx /= ring.length; my /= ring.length;
  let sxx = 0, syy = 0, sxy = 0;
  for (const [x, y] of ring) { const dx = x - mx, dy = y - my; sxx += dx * dx; syy += dy * dy; sxy += dx * dy; }
  let deg = (0.5 * Math.atan2(2 * sxy, sxx - syy) * 180) / Math.PI;
  while (deg > 90) deg -= 180;
  while (deg < -90) deg += 180;
  return deg;
}

/** Outer rings of sibling features fully enclosed by this one (Vatican inside
 *  Lazio, Lesotho inside South Africa). Treated as virtual holes so the label
 *  lands in the surrounding ring instead of on top of the enclave. */
function buildVirtualHoles(features, pcodeKey) {
  const out = new Map();
  if (features.length > 400) return out;   // O(n²) guard for very large uploads
  const boxes = features.map((f) => {
    const rings = collectAllOuterRings(f.geometry);
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const r of rings) for (const [x, y] of r) {
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
    }
    return { f, rings, box: [minX, minY, maxX, maxY] };
  });
  for (const a of boxes) {
    const holes = [];
    for (const b of boxes) {
      if (a === b) continue;
      const [aX0, aY0, aX1, aY1] = a.box, [bX0, bY0, bX1, bY1] = b.box;
      if (!(bX0 >= aX0 && bY0 >= aY0 && bX1 <= aX1 && bY1 <= aY1)) continue;
      const outer = a.rings[0];
      if (!outer || outer.length < 3) continue;
      const c = b.rings[0] && d3poly.polygonCentroid(b.rings[0]);
      if (c && d3poly.polygonContains(outer, c)) holes.push(b.rings[0]);
    }
    if (holes.length) out.set(a.f.properties[pcodeKey], holes);
  }
  return out;
}
function collectAllOuterRings(geometry) {
  if (!geometry) return [];
  if (geometry.type === 'Polygon') return [geometry.coordinates[0]];
  if (geometry.type === 'MultiPolygon') return geometry.coordinates.map((p) => p[0]);
  return [];
}

/* ============================================================= renderers === */

/** d3.geoMercator + fitExtent — good for country / sub-national extents and
 *  free of any dependency on a global projection choice. */
function buildProjection(featureCollection, width, height, padding) {
  const proj = d3geo.geoMercator();
  const inner = [[padding, padding],
    [Math.max(padding + 1, width - padding), Math.max(padding + 1, height - padding)]];
  try { proj.fitExtent(inner, featureCollection); } catch (e) { /* degenerate input */ }
  return { projection: proj, path: d3geo.geoPath(proj) };
}

function renderChoropleth(layer, path, rows, cls) {
  clear(layer);
  const nodes = [];
  for (const r of rows) {
    const d = path(r.feature);
    if (!d) continue;
    const p = sel('path', { class: cls, d, fill: r.fill, 'fill-opacity': r.fillOpacity,
      'data-pcode': r.pcode || '', 'vector-effect': 'non-scaling-stroke' });
    p.__row = r;
    layer.appendChild(p);
    nodes.push(p);
  }
  return nodes;
}

function applyBorders(adm1Layer, adm2Layer, st) {
  for (const p of adm1Layer.children) {
    p.setAttribute('stroke', st.stateColor);
    p.setAttribute('stroke-width', st.stateWidth);
    p.setAttribute('stroke-opacity', p.__dim ? Math.min(st.stateOpacity, 0.35) : st.stateOpacity);
  }
  for (const p of adm2Layer.children) {
    p.setAttribute('stroke', st.localityColor);
    p.setAttribute('stroke-width', st.localityWidth);
    p.setAttribute('stroke-opacity', st.localityOpacity);
  }
}

/** Blurred copy of the outline behind every other layer. Stripped from the
 *  SVG export — feGaussianBlur rasterises unpredictably downstream. */
function renderGlow(layer, path, features, st) {
  clear(layer);
  if (!st.countryGlowShow || !features.length) return;
  const radius = Math.max(0, st.countryGlowRadius);
  const id = 'cs-glow';
  const defs = sel('defs');
  const filter = sel('filter', { id, x: '-50%', y: '-50%', width: '200%', height: '200%' });
  filter.appendChild(sel('feGaussianBlur', { stdDeviation: Math.max(0.5, radius / 2) }));
  defs.appendChild(filter);
  layer.appendChild(defs);
  const d = path({ type: 'FeatureCollection', features }) || '';
  layer.appendChild(sel('path', { d, fill: st.countryGlowColor, stroke: st.countryGlowColor,
    'stroke-width': Math.max(2, radius / 2), filter: `url(#${id})`, opacity: st.countryGlowOpacity,
    'pointer-events': 'none' }));
}

/* ------------------------------------------------------------- bubbles ---- */
/* Port of src/render/bubbles.ts: √-scaled radius between min/max px, largest
 * painted first so small bubbles stay on top, counter-zoom transform so the
 * on-screen radius is stable while zooming. */

function applyCounterZoomTransform(g, zoom) {
  const x = parseFloat(g.getAttribute('data-anchor-x') || '0');
  const y = parseFloat(g.getAttribute('data-anchor-y') || '0');
  const s = g.getAttribute('data-constant-size') === '1' && zoom > 0 ? 1 / zoom : 1;
  g.setAttribute('transform', s !== 1 ? `translate(${x},${y}) scale(${s})` : `translate(${x},${y})`);
}
function updateCounterZoom(layer, zoom) {
  if (!layer) return;
  for (const g of layer.querySelectorAll('g[data-anchor-x]')) applyCounterZoomTransform(g, zoom);
}

function renderBubbles(layer, projection, features, lookup, pcodeKey, st, zoom) {
  clear(layer);
  if (!st.show) return null;
  layer.setAttribute('pointer-events', 'none');

  const valued = [];
  for (const f of features) {
    const code = f.properties?.[pcodeKey];
    if (!code) continue;
    const datum = lookup.get(code);
    if (!datum || datum.bubbleSize == null) continue;
    if (st.zeroAsBlank && datum.bubbleSize === 0) continue;
    const anchorGeo = pickAnchor(f.geometry, { largestPartOnly: true, avoidHoles: false });
    if (!anchorGeo) continue;
    const p = projection(anchorGeo);
    if (!p) continue;
    valued.push({ datum, anchor: p });
  }
  if (!valued.length) return null;

  const values = valued.map((v) => v.datum.bubbleSize);
  const minV = Math.min(...values), maxV = Math.max(...values);
  const scale = (v) => {
    if (maxV === minV) return (st.minRadius + st.maxRadius) / 2;
    const t = Math.sqrt(Math.max(0, v - minV)) / Math.sqrt(Math.max(1e-9, maxV - minV));
    return st.minRadius + (st.maxRadius - st.minRadius) * t;
  };
  valued.sort((a, b) => b.datum.bubbleSize - a.datum.bubbleSize);

  const anchors = new Map();
  for (const v of valued) {
    const r = scale(v.datum.bubbleSize);
    const g = sel('g', { class: 'cs-bubble', 'data-anchor-x': v.anchor[0], 'data-anchor-y': v.anchor[1] });
    if (st.constantSize) g.setAttribute('data-constant-size', '1');
    applyCounterZoomTransform(g, zoom);
    g.appendChild(sel('circle', { cx: 0, cy: 0, r, fill: st.fillColor, 'fill-opacity': st.opacity,
      stroke: st.strokeColor, 'stroke-width': st.strokeWidth }));
    layer.appendChild(g);
    anchors.set(v.datum.pcode, { x: v.anchor[0], y: v.anchor[1], r });
  }
  return { minValue: minV, maxValue: maxV, scale, anchors };
}

/* -------------------------------------------------------------- glyphs ---- */
/* Port of src/render/glyphs.ts. */

function arcPath(cx, cy, r0, r1, a0, a1) {
  const x0o = cx + r1 * Math.cos(a0), y0o = cy + r1 * Math.sin(a0);
  const x1o = cx + r1 * Math.cos(a1), y1o = cy + r1 * Math.sin(a1);
  const large = a1 - a0 > Math.PI ? 1 : 0;
  if (r0 <= 0) return `M ${cx},${cy} L ${x0o},${y0o} A ${r1},${r1} 0 ${large} 1 ${x1o},${y1o} Z`;
  const x0i = cx + r0 * Math.cos(a1), y0i = cy + r0 * Math.sin(a1);
  const x1i = cx + r0 * Math.cos(a0), y1i = cy + r0 * Math.sin(a0);
  return `M ${x0o},${y0o} A ${r1},${r1} 0 ${large} 1 ${x1o},${y1o} L ${x0i},${y0i} ` +
         `A ${r0},${r0} 0 ${large} 0 ${x1i},${y1i} Z`;
}
/** Outer circle minus inner circle, even-odd filled. Needed because a donut
 *  arc that starts and ends at the same point renders nothing. */
function annulusPath(cx, cy, rIn, rOut) {
  return `M ${cx - rOut},${cy} A ${rOut},${rOut} 0 1 0 ${cx + rOut},${cy} A ${rOut},${rOut} 0 1 0 ${cx - rOut},${cy} Z ` +
         `M ${cx - rIn},${cy} A ${rIn},${rIn} 0 1 1 ${cx + rIn},${cy} A ${rIn},${rIn} 0 1 1 ${cx - rIn},${cy} Z`;
}

function drawPie(g, radius, values, st) {
  const total = values.reduce((a, b) => a + Math.max(0, b), 0);
  if (total <= 0) return;
  const innerRatio = st.type === 'donut' ? clamp(st.donutInnerRatio || 0.5, 0, 0.85) : 0;
  const rIn = radius * innerRatio;
  const common = { 'fill-opacity': st.opacity, stroke: st.stroke, 'stroke-width': st.strokeWidth };

  // Single positive measure: a full-circle arc degenerates to nothing, so draw
  // the circle (or annulus) directly.
  const positives = values.map((v, i) => ({ v: Math.max(0, v), i })).filter((p) => p.v > 0);
  if (positives.length === 1) {
    const fill = st.colors[positives[0].i % st.colors.length] || '#888';
    g.appendChild(rIn > 0
      ? sel('path', { d: annulusPath(0, 0, rIn, radius), 'fill-rule': 'evenodd', fill, ...common })
      : sel('circle', { cx: 0, cy: 0, r: radius, fill, ...common }));
    return;
  }
  let a0 = -Math.PI / 2;   // 12 o'clock
  for (let i = 0; i < values.length; i++) {
    const v = Math.max(0, values[i]);
    if (v <= 0) continue;
    const a1 = a0 + (v / total) * Math.PI * 2;
    g.appendChild(sel('path', { d: arcPath(0, 0, rIn, radius, a0, a1),
      fill: st.colors[i % st.colors.length] || '#888', ...common }));
    a0 = a1;
  }
}

/** One circle per measure, radius ∝ √(value/peak) so AREA is proportional —
 *  same convention as the bubble layer. Largest first. */
function drawConcentric(g, outerRadius, values, st) {
  const positives = values.map((v) => Math.max(0, v));
  const peak = Math.max(...positives, 0);
  if (peak <= 0) return;
  const indexed = positives.map((v, i) => ({ v, i })).filter((p) => p.v > 0).sort((a, b) => b.v - a.v);
  for (const { v, i } of indexed) {
    const r = outerRadius * Math.sqrt(v / peak);
    if (r <= 0) continue;
    g.appendChild(sel('circle', { cx: 0, cy: 0, r, fill: st.colors[i % st.colors.length] || '#888',
      'fill-opacity': st.opacity, stroke: st.stroke, 'stroke-width': st.strokeWidth }));
  }
}

function drawColumn(g, totalHeight, values, st) {
  const positives = values.map((v) => Math.max(0, v));
  const peak = Math.max(...positives, 0);
  if (peak <= 0) return;
  const colW = Math.max(2, totalHeight * 0.18);
  const gap = Math.max(1, totalHeight * 0.08);
  const totalW = positives.length * colW + (positives.length - 1) * gap;
  const x0 = -totalW / 2, baseline = totalHeight / 2;
  for (let i = 0; i < positives.length; i++) {
    const h = (positives[i] / peak) * totalHeight;
    if (h <= 0) continue;
    g.appendChild(sel('rect', { x: x0 + i * (colW + gap), y: baseline - h, width: colW, height: h,
      fill: st.colors[i % st.colors.length] || '#888', 'fill-opacity': st.opacity,
      stroke: st.stroke, 'stroke-width': st.strokeWidth }));
  }
}

function renderGlyphs(layer, projection, features, lookup, pcodeKey, st, zoom) {
  clear(layer);
  if (!st.show) return null;
  layer.setAttribute('pointer-events', 'none');

  const valued = [];
  for (const f of features) {
    const code = f.properties?.[pcodeKey];
    if (!code) continue;
    const datum = lookup.get(code);
    if (!datum || !datum.glyphValues?.length) continue;
    const vals = st.zeroAsBlank ? datum.glyphValues.map((v) => (v === 0 ? 0 : v)) : datum.glyphValues;
    const total = vals.reduce((a, b) => a + (b > 0 ? b : 0), 0);
    if (total <= 0) continue;
    const anchorGeo = pickAnchor(f.geometry, { largestPartOnly: true, avoidHoles: false });
    if (!anchorGeo) continue;
    const p = projection(anchorGeo);
    if (!p) continue;
    valued.push({ datum, anchor: p, total, vals });
  }
  if (!valued.length) return { anchors: new Map() };

  const minT = Math.min(...valued.map((v) => v.total));
  const maxT = Math.max(...valued.map((v) => v.total));
  const scale = (t) => {
    if (!st.scaleByTotal || maxT === minT) return st.maxSize;
    const k = Math.sqrt(Math.max(0, t - minT)) / Math.sqrt(Math.max(1e-9, maxT - minT));
    return st.minSize + (st.maxSize - st.minSize) * k;
  };
  valued.sort((a, b) => b.total - a.total);

  const anchors = new Map();
  for (const v of valued) {
    const size = scale(v.total);
    const g = sel('g', { class: 'cs-glyph', 'data-anchor-x': v.anchor[0], 'data-anchor-y': v.anchor[1] });
    if (st.constantSize) g.setAttribute('data-constant-size', '1');
    applyCounterZoomTransform(g, zoom);
    if (st.type === 'pie' || st.type === 'donut') drawPie(g, size, v.vals, st);
    else if (st.type === 'concentric') drawConcentric(g, size, v.vals, st);
    else drawColumn(g, size, v.vals, st);
    layer.appendChild(g);
    anchors.set(v.datum.pcode, { x: v.anchor[0], y: v.anchor[1],
      size: st.type === 'column' ? size / 2 : size });
  }
  return { anchors };
}

/* -------------------------------------------------------------- labels ---- */
/* Port of src/render/labels.ts — anchor, compose lines, fit-to-shape, halo. */

const approxTextWidth = (text, fontSize) => text.length * fontSize * 0.55;

function abbreviate(text, maxPx, fontSize) {
  if (!text) return text;
  const maxChars = Math.max(3, Math.floor(maxPx / (fontSize * 0.55)));
  return text.length <= maxChars ? text : text.slice(0, Math.max(1, maxChars - 1)) + '…';
}
function wrapWords(text, maxChars) {
  const out = [];
  let cur = '';
  for (const w of text.split(/\s+/)) {
    if (!cur) { cur = w; continue; }
    if (cur.length + 1 + w.length > maxChars) { out.push(cur); cur = w; } else cur += ' ' + w;
  }
  if (cur) out.push(cur);
  return out;
}

function valueSourceFlags(s) {
  switch (s) {
    case 'bubble': return { choropleth: false, bubble: true, custom: false };
    case 'both': return { choropleth: true, bubble: true, custom: false };
    case 'custom': return { choropleth: false, bubble: false, custom: true };
    case 'choropleth_custom': return { choropleth: true, bubble: false, custom: true };
    case 'bubble_custom': return { choropleth: false, bubble: true, custom: true };
    case 'all': return { choropleth: true, bubble: true, custom: true };
    default: return { choropleth: true, bubble: false, custom: false };
  }
}

function composeLines(label, st) {
  const want = valueSourceFlags(st.valueSource);
  const colorTxt = label.value != null ? fmtNumber(label.value, st.decimals, st.format) : '';
  const bubbleTxt = label.bubbleValue != null ? fmtNumber(label.bubbleValue, st.decimals, st.format) : '';
  const customTxt = label.value2 != null ? fmtNumber(label.value2, st.decimals, st.format) : '';

  let valueLines = [];
  if (want.choropleth && colorTxt) valueLines.push({ text: colorTxt, kind: 'value' });
  if (want.bubble && bubbleTxt) valueLines.push({ text: bubbleTxt, kind: 'bubble_value' });
  if (want.custom && customTxt) valueLines.push({ text: customTxt, kind: 'custom_value' });
  // The picked source isn't bound — fall back to whatever IS, so a
  // "Value only" label never silently vanishes.
  if (!valueLines.length) {
    if (colorTxt) valueLines.push({ text: colorTxt, kind: 'value' });
    if (bubbleTxt) valueLines.push({ text: bubbleTxt, kind: 'bubble_value' });
    if (customTxt) valueLines.push({ text: customTxt, kind: 'custom_value' });
  }

  const rawName = (st.nameSource === 'labelText1' && label.nameOverride) ? label.nameOverride : (label.name || '');
  let nameLines = [rawName];
  if (st.wordsOnSeparateLines && nameLines[0]) nameLines = nameLines[0].split(/\s+/);
  const named = nameLines.filter(Boolean).map((t) => ({ text: t, kind: 'name' }));

  if (st.content === 'value') return valueLines;
  if (st.content === 'name') return named;

}

function applyLabelTransform(g, zoom) {
  const num = (a) => parseFloat(g.getAttribute(a) || '0');
  const x = num('data-anchor-x'), y = num('data-anchor-y'), dy = num('data-anchor-dy');
  const rot = num('data-rotation'), padX = num('data-pad-x'), padY = num('data-pad-y');
  const s = g.getAttribute('data-constant-size') === '1' && zoom > 0 ? 1 / zoom : 1;

  // label and its bubble survives the map group's scale().
  const px = x + (zoom > 0 ? padX / zoom : 0);

  if (s !== 1) parts.push(`scale(${s})`);
  if (rot) parts.push(`rotate(${rot})`);

}
function updateLabelTransforms(layer, zoom) {
  if (!layer) return;
  for (const g of layer.querySelectorAll('g.cs-label')) applyLabelTransform(g, zoom);
}

function pathBBox(path, feature) {

  } catch (e) { return null; }

function renderLabels(layer, projection, path, labels, st, opts = {}) {
