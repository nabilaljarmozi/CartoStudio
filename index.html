/* ============================================================== export ===== */

const EXPORT_FONT = '"Segoe UI", Helvetica, Arial, sans-serif';

/**
 * Self-contained snapshot of the live map: clone, inline the font stack, drop
 * the blur filter (it rasterises unpredictably in Illustrator / PowerPoint),
 * thin the label halos to a hairline (screen halos read as a chunky band at
 * print resolution), and paint the background.
 */
function buildExportSvg() {
  if (!hasGeometry()) throw new Error('Nothing to export — upload geometry first');
  const w = state.viewportW, h = state.viewportH;
  const clone = svgRoot.cloneNode(true);
  clone.setAttribute('xmlns', SVGNS);
  clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
  clone.setAttribute('width', w);
  clone.setAttribute('height', h);
  clone.setAttribute('viewBox', `0 0 ${w} ${h}`);
  clone.removeAttribute('style');

  clone.querySelector('.cs-layer-glow')?.remove();
  for (const t of clone.querySelectorAll('.cs-label text[stroke]')) t.setAttribute('stroke-width', '0.3');

  const bgColor = S().general.transparentBackground ? '#ffffff' : (S().general.background || '#ffffff');
  const bgRect = clone.querySelector('rect');
  if (bgRect) { bgRect.setAttribute('width', w); bgRect.setAttribute('height', h); bgRect.setAttribute('fill', bgColor); }

  const style = sel('style');
  style.textContent = `svg{font-family:${EXPORT_FONT}}text{white-space:pre}`;
  clone.insertBefore(style, clone.firstChild);

  const title = sel('title');
  title.textContent = state.geom.adm1Name ? `${APP.name} — ${state.geom.adm1Name}` : APP.name;
  const desc = sel('desc');
  desc.textContent = `Made with ${APP.name} ${APP.version} (${APP.site}) by ${APP.author} — ${APP.linkedin}`;
  clone.insertBefore(desc, clone.firstChild);
  clone.insertBefore(title, clone.firstChild);

  const xml = new XMLSerializer().serializeToString(clone);
  return { xml, width: w, height: h, bgColor };
}

function exportSvg() {
  try {
    const { xml } = buildExportSvg();
    downloadBlob(new Blob([xml], { type: 'image/svg+xml;charset=utf-8' }), `${exportBaseName()}.svg`);
    toast('SVG downloaded');
  } catch (e) { toast(e.message, true); }
}

function exportBaseName() {
  const base = (state.geom.adm1Name || 'cartostudio').replace(/\.(geo|topo)?json$/i, '').replace(/[^\w-]+/g, '-');
  return state.drill ? `${base}-${String(admin1NameFor(state.drill)).replace(/[^\w-]+/g, '-')}` : base;
}

/** SVG → offscreen canvas → PNG blob, at the requested scale factor. */
function rasterise(scale) {
  const built = buildExportSvg();
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(new Blob([built.xml], { type: 'image/svg+xml;charset=utf-8' }));
    const img = new Image();
    img.onload = () => {
      try {
        const canvas = el('canvas');
        canvas.width = Math.round(built.width * scale);
        canvas.height = Math.round(built.height * scale);
        const ctx = canvas.getContext('2d');
        if (!ctx) throw new Error('2D canvas unavailable');
        ctx.fillStyle = built.bgColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        canvas.toBlob((blob) => blob ? resolve({ blob, canvas, ...built })
          : reject(new Error('Canvas produced no image')), 'image/png');
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('The browser could not rasterise the SVG')); };
    img.src = url;
  });
}

async function exportPng() {
  try {
    const scale = parseFloat($('#pngScale').value) || 2;
    const { blob } = await rasterise(scale);
    downloadBlob(blob, `${exportBaseName()}@${scale}x.png`);
    toast(`PNG downloaded at ${scale}×`);
  } catch (e) { toast(e.message, true); }
}

const PAPER_PT = {
  a5: [419.53, 595.28], a4: [595.28, 841.89], a3: [841.89, 1190.55],
  letter: [612, 792], legal: [612, 1008], tabloid: [792, 1224]
};

async function exportPdf() {
  try {
    toast('Building PDF…');
    const JsPDF = await getJsPDF();
    const paper = $('#pdfPaper').value;
    const orientation = $('#pdfOrient').value;
    const [pw, ph] = PAPER_PT[paper] || PAPER_PT.a4;
    const pageW = orientation === 'landscape' ? ph : pw;
    const pageH = orientation === 'landscape' ? pw : ph;

    const { canvas } = await rasterise(Math.max(2, Math.ceil((pageW * 2) / state.viewportW)));
    const doc = new JsPDF({ orientation, unit: 'pt', format: [pw, ph], compress: true });
    doc.setProperties({ title: `${APP.name} — ${state.geom.adm1Name || 'map'}`, author: APP.author,
      creator: `${APP.name} ${APP.version}` });
    const margin = 28;
    const availW = pageW - margin * 2, availH = pageH - margin * 2;
    const ratio = Math.min(availW / canvas.width, availH / canvas.height);
    const drawW = canvas.width * ratio, drawH = canvas.height * ratio;
    doc.addImage(canvas.toDataURL('image/png'), 'PNG',
      margin + (availW - drawW) / 2, margin + (availH - drawH) / 2, drawW, drawH, undefined, 'FAST');

    if ($('#pdfLegendPage').checked) { doc.addPage(); drawLegendPage(doc, pageW, pageH, margin); }
    doc.save(`${exportBaseName()}-${paper}.pdf`);
    toast('PDF downloaded');
  } catch (e) { toast(e.message || String(e), true); }
}

/** Second page: the legend as a plain vector table, for print handoff. */
function drawLegendPage(doc, pageW, pageH, margin) {
  const li = state.last?.legendInputs;
  let y = margin + 12;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
  doc.text('Map key', margin, y);
  y += 22;
  const rowH = 17;
  const section = (title) => {
    if (y > pageH - margin - 40) { doc.addPage(); y = margin + 20; }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
    doc.text(title, margin, y); y += 15;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  };
  const swatchRow = (color, label) => {
    if (y > pageH - margin - rowH) { doc.addPage(); y = margin + 20; }
    const c = parseHex(color) || { r: 200, g: 200, b: 200 };
    doc.setFillColor(c.r, c.g, c.b); doc.setDrawColor(110);
    doc.rect(margin, y - 9, 14, 11, 'FD');
    doc.setTextColor(30); doc.text(String(label), margin + 22, y);
    y += rowH;
  };
  if (li?.value) {
    section(li.value.title || 'Choropleth');
    for (const cl of li.value.classes) {
      swatchRow(cl.color, cl.label != null ? cl.label
        : (cl.from === cl.to ? fmtNumber(cl.to, li.value.decimals, 'auto')
          : `${fmtNumber(cl.from, li.value.decimals, 'auto')} – ${fmtNumber(cl.to, li.value.decimals, 'auto')}`));
    }
    y += 8;
  }
  if (li?.glyph) {
    section(li.glyph.title || 'Categories');
    for (const it of li.glyph.items) swatchRow(it.color, it.label);
    y += 8;
  }
  if (li?.bubble) {
    section(li.bubble.title || 'Bubble size');
    swatchRow(li.bubble.fillColor, `Smallest — ${fmtNumber(li.bubble.minValue, 0, 'auto')}`);
    swatchRow(li.bubble.fillColor, `Largest — ${fmtNumber(li.bubble.maxValue, 0, 'auto')}`);
    y += 8;
  }
  if (li?.levels) {
    section(li.levels.title || 'Admin levels');
    for (const it of li.levels.items) swatchRow(it.color, it.label);
    y += 8;
  }
  if (li?.values) {
    section(li.values.title || 'Values on labels');
    for (const it of li.values.items) swatchRow(it.color, it.label);
  }
  doc.setFontSize(8); doc.setTextColor(130);
  doc.text(`${state.geom.adm1Name || 'custom geometry'} · made with ${APP.name} ${APP.version} by ${APP.author}`,
    margin, pageH - margin / 2);
}

/* ========================================================== persistence ==== */

/* The workspace is stored in two keys so a colour drag rewrites a couple of KB
 * of design rather than re-serialising a multi-megabyte boundary file. */
const LS_DESIGN = 'cartostudio.design.v1';
const LS_PAYLOAD = 'cartostudio.payload.v1';
const LS_MAX = 3.5 * 1024 * 1024;   // don't try to stash huge uploads

function projectPayload(includeGeometry = true) {
  return {
    version: 1,
    settings: state.settings,
    mapping: state.geom.mapping,
    roles: state.data.roles,
    drill: state.drill,
    geometry: includeGeometry && state.geom.adm1 ? {
      adm1: state.geom.adm1, adm2: state.geom.adm2,
      adm1Name: state.geom.adm1Name, adm2Name: state.geom.adm2Name,
      adm1Props: state.geom.adm1Props, adm2Props: state.geom.adm2Props
    } : null,
    data: includeGeometry && state.data.rows.length ? {
      rows: state.data.rows, columns: state.data.columns, fileName: state.data.fileName
    } : null
  };
}

function applyPayload(p, { withGeometry = true } = {}) {
  if (!p || typeof p !== 'object') throw new Error('Not a CartoStudio project file');
  invalidateAreas();
  // Merge onto the defaults so files written by an older build still open.
  const merged = defaultSettings();
  for (const [card, values] of Object.entries(p.settings || {})) {
    if (!merged[card]) continue;
    for (const [k, v] of Object.entries(values)) if (k in merged[card]) merged[card][k] = v;
  }
  state.settings = merged;
  if (p.mapping) state.geom.mapping = { ...state.geom.mapping, ...p.mapping };
  if (p.roles) state.data.roles = { ...state.data.roles, ...p.roles,
    glyphValues: p.roles.glyphValues || [], tooltips: p.roles.tooltips || [] };
  if (withGeometry && p.geometry?.adm1) {
    const g = state.geom;
    g.adm1 = normaliseToFC(p.geometry.adm1, 'saved Admin 1');
    g.adm2 = p.geometry.adm2 ? normaliseToFC(p.geometry.adm2, 'saved Admin 2') : null;
    g.adm1Name = p.geometry.adm1Name || 'Admin 1';
    g.adm2Name = p.geometry.adm2Name || '';
    g.adm1Props = p.geometry.adm1Props?.length ? p.geometry.adm1Props : collectPropertyNames(g.adm1);
    g.adm2Props = g.adm2 ? (p.geometry.adm2Props?.length ? p.geometry.adm2Props : collectPropertyNames(g.adm2)) : [];
    // Saved geometry was already rewound and mapped, but re-running both is
    // idempotent and repairs hand-edited files.
    rewindFeatureCollection(g.adm1);
    if (g.adm2) rewindFeatureCollection(g.adm2);
    applyMapping(g.adm1, 1, g.mapping);
    if (g.adm2) applyMapping(g.adm2, 2, g.mapping);
  }
  if (withGeometry && p.data?.rows?.length) {
    state.data.rows = p.data.rows;
    state.data.columns = p.data.columns || Object.keys(p.data.rows[0] || {});
    state.data.fileName = p.data.fileName || 'restored table';
  }
  state.drill = p.drill || null;
}

const saveDesign = debounce(() => {
  try { localStorage.setItem(LS_DESIGN, JSON.stringify(projectPayload(false))); }
  catch (e) { /* private mode / quota — the session still works */ }
}, 400);

function savePayload() {
  try {
    const p = projectPayload(true);
    const json = JSON.stringify({ geometry: p.geometry, data: p.data });
    if (json.length <= LS_MAX) localStorage.setItem(LS_PAYLOAD, json);
    else localStorage.removeItem(LS_PAYLOAD);   // too big to restore automatically
  } catch (e) { try { localStorage.removeItem(LS_PAYLOAD); } catch (e2) { /* ignore */ } }
}

/** Design on every change; uploads only when the uploads themselves change. */
/* A project that arrived from a link or a baked standalone belongs to whoever
 * sent it. Editing it must not quietly replace whatever this browser already
 * had stored — the recipient never chose to give that up. `?edit=1` reopens the
 * editor but does not change who the map belongs to, so the guard cannot be
 * keyed on VIEW_ONLY alone. "Keep this map" in the Project menu adopts it. */
let foreignProject = false;
let foreignWarned = false;

function adoptForeignProject() {
  foreignProject = false;
  $('#miAdopt').hidden = true;
  saveLocal(true);
  toast('Saved to this browser — it will be here when you come back');
}

function saveLocal(withPayload = false) {
  if (VIEW_ONLY) return;   // a shared map is a view, not a workspace
  if (foreignProject) {
    if (!foreignWarned) {
      foreignWarned = true;
      toast('Editing a shared map — changes are not saved to this browser. ' +
        'Project → Keep this map, or Save project, to hold on to them.');
    }
    return;
  }
  saveDesign();
  if (withPayload) savePayload();
}

function loadLocal() {
  try {
    const design = JSON.parse(localStorage.getItem(LS_DESIGN) || 'null');
    const payload = JSON.parse(localStorage.getItem(LS_PAYLOAD) || 'null');
    if (!design && !payload) return false;
    applyPayload({ ...(design || {}), ...(payload || {}) });
    return true;
  } catch (e) { return false; }
}

/* ================================================== sharing / embedding ==== */
/* No server exists to upload a map to, so a shared map has to carry itself.
 * Two routes, in ascending order of how much they can hold:
 *   embed     — the whole project gzipped into an <iframe> src, chrome hidden
 *   standalone— the app's own source with the project baked in as one .html
 */

/* btoa needs a binary string; spreading a big Uint8Array into fromCharCode
 * overflows the argument limit, so walk it in chunks. */
function bytesToB64(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
const b64ToBytes = (b64) => Uint8Array.from(
  atob(b64.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
const b64encode = (str) => bytesToB64(new TextEncoder().encode(str));
const b64decode = (b64) => new TextDecoder().decode(b64ToBytes(b64));

/** gzip when the browser has CompressionStream (GeoJSON shrinks ~10×),
 *  otherwise plain base64. The leading byte records which. */
async function packState(payload) {
  const json = JSON.stringify(payload);
  if (typeof CompressionStream === 'function') {
    try {
      const stream = new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));
      const buf = await new Response(stream).arrayBuffer();
      return 'z' + bytesToB64(new Uint8Array(buf));
    } catch (e) { /* fall through to plain */ }
  }
  return 'j' + b64encode(json);
}
async function unpackState(packed) {
  if (packed[0] === 'z') {
    const stream = new Blob([b64ToBytes(packed.slice(1))]).stream()
      .pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(await new Response(stream).text());
  }
  return JSON.parse(b64decode(packed.slice(1)));
}

/** The embed carries the whole project in its iframe src — nothing is uploaded,
 *  so the URL is the transport. `#m=` full map (`#d=` design-only and `#s=` are
 *  older formats, still read so links already shared keep working). */
async function buildShareUrl() {
  const packed = await packState(projectPayload(true));
  // A file:// page has no origin a recipient could open, and a standalone file
  // ignores the hash in favour of its own baked project — so both point at the
  // hosted copy instead; the payload travels either way.
  const base = (location.protocol === 'file:' || window.__CARTOSTUDIO_MAP__)
    ? APP.site : `${location.origin}${location.pathname}`;
  return `${base}?embed=1#m=${packed}`;
}

async function loadFromHash() {
  const m = /[#&]([dms])=([^&]+)/.exec(location.hash || '');
  if (!m) return false;
  try {
    const [, kind, packed] = m;
    const payload = kind === 's' ? JSON.parse(b64decode(packed)) : await unpackState(packed);
    applyPayload(payload, { withGeometry: kind === 'm' });
    if (kind === 'm') foreignProject = true;
    return true;
  } catch (e) {
    toast('That shared link could not be read — it may have been truncated in transit.', true);
    return false;
  }
}

/** Rebuild this page's source with the project injected as a plain script that
 *  runs before the module. Needs the app served over http(s); a page opened
 *  from file:// cannot fetch its own source. */
async function buildStandaloneHtml() {
  let src;
  try {
    const res = await fetch(location.pathname, { cache: 'reload' });
    if (!res.ok) throw new Error(String(res.status));
    src = await res.text();
  } catch (e) {
    throw new Error('A standalone file needs the app served over http(s). Open the hosted copy at '
      + APP.site + ' and try again.');
  }
  const marker = '<script type="module">';
  if (!src.includes(marker)) throw new Error('Could not find the app script to inject into');
  // Every `<` is escaped so a closing script tag inside the data cannot end
  // the injected tag early. (This comment avoids writing that sequence out for
  // the same reason: the HTML parser ends the element wherever it appears.)
  const json = JSON.stringify(projectPayload(true)).replace(/</g, '\\u003c');
  // __CARTOSTUDIO_VIEW__ makes the file open as a finished map rather than as
  // the editor with a project loaded. A classic script runs before the deferred
  // module, so both are set by the time the app boots.
  const inject = `<script>window.__CARTOSTUDIO_MAP__=${json};window.__CARTOSTUDIO_VIEW__=true;</`
    + `script>\n`;
  // Function replacer, not a string: `$&`, `$'` and `$$` inside the project
  // data would otherwise be expanded by String.replace and corrupt the payload.
  return src.replace(marker, () => inject + marker);
}

/* View-only strips the app down to the map: no top bar, no panels, nothing to
 * build before the first paint. Set by ?embed=1 on an iframe src, or baked into
 * a standalone file. `?edit=1` reopens the full editor on either. */
const VIEW_ONLY = (() => {
  const q = new URLSearchParams(location.search);
  if (q.get('edit') === '1') return false;
  return q.get('embed') === '1' || window.__CARTOSTUDIO_VIEW__ === true;
})();

function applyViewMode() {
  if (!VIEW_ONLY) return;
  document.body.classList.add('view-only');
  $('#canvasWrap').appendChild(el('a', { class: 'embed-credit', href: APP.site,
    target: '_blank', rel: 'noreferrer noopener', text: 'Made with CartoStudio' }));
}

async function copyToClipboard(text, okMessage) {
  try { await navigator.clipboard.writeText(text); toast(okMessage); return true; }
  catch (e) { toast('Clipboard blocked — select the text and copy manually', true); return false; }
}

function shareSizeNote(chars) {
  const kb = (chars / 1024).toFixed(chars > 10240 ? 0 : 1);
  if (chars > 1.5e6) return { cls: 'bad', pct: 100,
    text: `${kb} KB — too long for a URL. Use the standalone file instead.` };
  if (chars > 32000) return { cls: 'bad', pct: 100,
    text: `${kb} KB — browsers will open this, but most chat apps and email clients truncate it. Prefer the standalone file.` };
  if (chars > 8000) return { cls: 'warn', pct: Math.round((chars / 32000) * 100),
    text: `${kb} KB — fine in a browser or a document; some chat apps shorten links this long.` };
  return { cls: '', pct: Math.max(4, Math.round((chars / 8000) * 100)),
    text: `${kb} KB — short enough to paste anywhere.` };
}

function openShareModal() {
  if (!hasGeometry()) {
    toast('Nothing to share yet — upload geometry first', true);
    return;
  }
  const embedOut = el('textarea', { class: 'share-out', rows: 5, readonly: true });
  const meta = el('div', { class: 'share-meta' }, el('span', { class: 'bar' }, el('i')), el('span'));

  let url = '';
  const refresh = async () => {
    url = await buildShareUrl();
    embedOut.value =
      `<iframe src="${url}"\n        style="width:100%;height:100%;min-height:420px;border:0"\n` +
      `        title="Map made with CartoStudio" loading="lazy"></iframe>`;
    // The payload rides in the iframe src, so URL length limits apply here too.
    const note = shareSizeNote(url.length);
    meta.className = `share-meta ${note.cls}`;
    meta.querySelector('i').style.width = `${Math.min(100, note.pct)}%`;
    meta.querySelector('span:last-child').textContent = note.text;
  };

  const tabs = el('div', { class: 'share-tabs' });
  const panes = [];
  const mkTab = (name, pane, on) => {
    const b = el('button', { text: name, onclick: () => {
      for (const t of tabs.children) t.classList.toggle('on', t === b);
      for (const p of panes) p.classList.toggle('on', p === pane);
    } });
    if (on) { b.classList.add('on'); pane.classList.add('on'); }
    tabs.appendChild(b);
    panes.push(pane);
  };

  const embedPane = el('div', { class: 'share-pane' },
    embedOut, meta,
    el('button', { class: 'tb-btn primary', text: 'Copy embed code',
      onclick: () => copyToClipboard(embedOut.value, 'Embed code copied') }),
    el('p', { class: 'hint', html: 'Paste into any page that accepts HTML. The map fills whatever box ' +
      'you put it in, so give the parent element a height — <code>height:100%</code> has nothing to ' +
      'resolve against otherwise, and the embed falls back to its 420px minimum.' }),
    el('p', { class: 'hint', html: 'The embedded map carries itself: nothing is uploaded, and it opens ' +
      'straight into the map with no editing chrome. Zoom, pan, drill and tooltips all work.' }));

  const standalonePane = el('div', { class: 'share-pane' },
    el('p', { class: 'hint', html: 'One <code>.html</code> file with the app and your map inside it. ' +
      'It opens straight into the finished map — no panels, no editing chrome. No size limit either, ' +
      'so this is the route for boundaries too large for a URL: email it, or host it as a public map. ' +
      'It still pulls the map libraries from a CDN, so the recipient needs to be online.' }),
    el('button', { class: 'tb-btn primary', text: 'Download standalone .html', onclick: async (e) => {
      const btn = e.currentTarget;
      btn.disabled = true;
      try {
        const html = await buildStandaloneHtml();
        downloadBlob(new Blob([html], { type: 'text/html' }), `${exportBaseName()}-map.html`);
        toast(`Standalone file downloaded (${(html.length / 1024 / 1024).toFixed(1)} MB)`);
      } catch (err) { toast(err.message, true); }
      btn.disabled = false;
    } }),
    el('p', { class: 'hint', text: 'Needs the app served over http(s) — a page opened from file:// '
      + 'cannot read its own source.' }));

  mkTab('Embed', embedPane, true);
  mkTab('Standalone file', standalonePane, false);

  openModal('Share this map', [tabs, embedPane, standalonePane], [['Close', closeModal, false]]);
  refresh();
}

function saveProjectFile() {
  const json = JSON.stringify(projectPayload(true));
  downloadBlob(new Blob([json], { type: 'application/json' }), `${exportBaseName()}-project.json`);
  toast(`Project saved (${(json.length / 1024 / 1024).toFixed(1)} MB)`);
}

async function openProjectFile(file) {
  try {
    applyPayload(JSON.parse(await readFileText(file)));
    resetView();
    buildDataPanel(); buildFormatPanel(); render(); saveLocal(true);
    toast(`Opened ${file.name}`);
  } catch (e) { toast(`Could not open project: ${e.message}`, true); }
}

/* ================================================================ boot ===== */

function wireMenu(buttonId, menuId, onAction) {
  const btn = $(`#${buttonId}`), menu = $(`#${menuId}`);
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const wasOpen = menu.classList.contains('open');
    for (const m of $$('.menu')) m.classList.remove('open');
    menu.classList.toggle('open', !wasOpen);
  });
  menu.addEventListener('click', (e) => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (!act) return;
    menu.classList.remove('open');
    onAction(act);
  });
}

function wireUi() {
  for (const b of $$('.tabs button')) {
    b.addEventListener('click', () => {
      for (const x of $$('.tabs button')) x.classList.toggle('on', x === b);
      $('#panelData').classList.toggle('on', b.dataset.tab === 'data');
      $('#panelFormat').classList.toggle('on', b.dataset.tab === 'format');
    });
  }
  $('#btnSide').addEventListener('click', () => {
    $('#side').classList.toggle('collapsed');
    requestAnimationFrame(render);
  });
  $('#btnShare').addEventListener('click', openShareModal);
  $('#btnUndo').addEventListener('click', undo);
  $('#btnRedo').addEventListener('click', redo);

  wireMenu('btnExport', 'menuExport', (act) => {
    if (act === 'svg') exportSvg();
    if (act === 'png') exportPng();
    if (act === 'pdf') exportPdf();
  });
  wireMenu('btnProject', 'menuProject', (act) => {
    if (act === 'save-json') saveProjectFile();
    if (act === 'share') openShareModal();
    if (act === 'adopt') adoptForeignProject();
    if (act === 'theme') {
      const list = el('div');
      for (const name of Object.keys(THEMES)) {
        list.appendChild(el('button', { class: 'tb-btn', style: 'width:100%;margin-bottom:6px;justify-content:flex-start',
          text: name, onclick: () => { applyTheme(name); closeModal(); } }));
      }
      openModal('Preset themes', [list, el('div', { class: 'hint',
        text: 'Themes touch colours and typography only — your bindings and layer toggles stay put.' })],
        [['Close', closeModal, false]]);
    }
    if (act === 'reset-fmt') {
      pushUndo();
      state.settings = defaultSettings();
      buildFormatPanel(); render(); saveLocal();
      toast('Formatting reset to defaults');
    }
    if (act === 'reset-all') {
      openModal('Clear everything?', [el('p', { text:
        'This removes the uploaded geometry, the data table and all formatting from this browser. It cannot be undone.' })], [
        ['Cancel', closeModal, false],
        ['Clear', () => {
          closeModal();
          try { localStorage.removeItem(LS_DESIGN); localStorage.removeItem(LS_PAYLOAD); } catch (e) { /* ignore */ }
          location.hash = '';
          location.reload();
        }, true]
      ]);
    }
  });
  document.addEventListener('click', () => { for (const m of $$('.menu')) m.classList.remove('open'); });
  $('#fileProject').addEventListener('change', async (e) => {
    const f = e.target.files?.[0];
    e.target.value = '';
    if (f) await openProjectFile(f);
  });
  $('#modalBack').addEventListener('click', (e) => { if (e.target.id === 'modalBack') closeModal(); });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
    if (!mod && e.key === 'Escape' && state.drill) { state.drill = null; resetView(); render(); }
  });

  new ResizeObserver(debounce(() => { if (hasGeometry()) render(); }, 90)).observe($('#canvasWrap'));
}

async function boot() {
  try {
    await loadDeps();
  } catch (e) {
    $('#empty').innerHTML = '<div class="drop"><h2>Could not load the map libraries</h2>' +
      '<p>CartoStudio pulls d3-geo, topojson-client, polylabel and papaparse from a CDN on first load. ' +
      'Check your network connection (or an ad-blocker / offline proxy) and reload.</p></div>';
    return;
  }
  setupSvg();
  svgRoot.setAttribute('font-family', EXPORT_FONT);
  // Precedence: a project baked into a standalone file, then a shared link,
  // then whatever this browser last had open. A link carrying only the design
  // layers on top of the local geometry rather than replacing it.
  const baked = window.__CARTOSTUDIO_MAP__;
  if (baked) { applyPayload(baked); foreignProject = true; }
  else if (VIEW_ONLY) await loadFromHash();    // stateless: never touch the visitor's workspace
  else { loadLocal(); await loadFromHash(); }
  applyViewMode();
  wireUi();
  wireCanvasGestures();
  buildDataPanel();
  buildFormatPanel();
  refreshUndoButtons();
  render();

  // Small scripting surface: handy from the browser console for batch work
  // ("colour every map in this folder the same way") and for automated checks.
  window.CartoStudio = { state, render, rebuildUi: () => { buildDataPanel(); buildFormatPanel(); },
    buildExportSvg, applyTheme, exportSvg, exportPng, exportPdf };
}

boot();

</script>
