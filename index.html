    const lines = composeLines(label, st);
    if (!lines.length) continue;

    const g = sel('g', { class: 'cs-label', 'data-anchor-x': px, 'data-anchor-y': py,
      'data-anchor-dy': 0, 'data-rotation': 0 });
    if (st.constantSize) g.setAttribute('data-constant-size', '1');
    let padX = override?.padX || 0, padY = override?.padY || 0;
    // Multi-line labels anchored to a bubble must shift further out so the
    // edge nearest the bubble sits where a single line would have.
    if (padY && lines.length > 1) padY += Math.sign(padY) * ((lines.length - 1) / 2) * (st.fontSize * 1.15);
    if (padX) g.setAttribute('data-pad-x', padX);
    if (padY) g.setAttribute('data-pad-y', padY);
    applyLabelTransform(g, zoom);

    let fontSize = st.fontSize;
    let rendered = lines.slice();
    let fits = true;
    const polyBBox = override ? null : pathBBox(path, label.feature);
    if (polyBBox) {
      let attempts = st.reduceFontSize ? 4 : 1;
      let stacked = false;
      while (attempts-- > 0) {
        const longest = rendered.reduce((m, l) => Math.max(m, approxTextWidth(l.text, fontSize)), 0);
        fits = fitsInside(polyBBox, [px, py], longest, rendered.length * fontSize * 1.15);
        if (st.allowOverrun || fits) break;
        if (st.stackWhenNeeded && !stacked) {
          stacked = true;
          const maxChars = Math.max(6, Math.floor((polyBBox[2] - polyBBox[0]) / (fontSize * 0.55)));
          rendered = rendered.flatMap((line) => (line.kind !== 'name' || !line.text.includes(' '))
            ? [line] : wrapWords(line.text, maxChars).map((t) => ({ text: t, kind: line.kind })));
          continue;   // re-test the stacked layout before shrinking
        }
        if (st.abbreviate) {
          rendered = rendered.map((l) => ({ ...l, text: abbreviate(l.text, polyBBox[2] - polyBBox[0], fontSize) }));
        }
        fontSize = Math.max(7, fontSize - 1);
      }
      const longest = rendered.reduce((m, l) => Math.max(m, approxTextWidth(l.text, fontSize)), 0);
      fits = fitsInside(polyBBox, [px, py], longest, rendered.length * fontSize * 1.15);
    }

    // Hide-on-overflow drops labels that still spill, and (in drill view) any
    // label whose ANCHOR sits inside the focused polygon. Testing the anchor
    // rather than the bbox lets a neighbour keep its label when only the text's
    // right edge pokes across.
    let crossesForbidden = false;
    if (forbiddenPolygon && forbiddenPolygon.length >= 3) {
      crossesForbidden = d3poly.polygonContains(forbiddenPolygon, [px, py]);
    }
    if (st.hideOnOverflow && ((polyBBox && !fits) || crossesForbidden)) continue;

    const lineHeight = fontSize * 1.15;
    const startY = -((rendered.length - 1) / 2) * lineHeight;
    const bbox = polyBBox || pathBBox(path, label.feature);
    let rotation = 0, dy = 0;
    if (st.placement === 'straight' || st.placement === 'curved') {
      rotation = principalAxisAngleDeg(label.feature.geometry, projection);
    }
    if (st.placement === 'boundary' && !override && bbox) dy = -((bbox[3] - bbox[1]) / 2) * 0.55;
    if (rotation || dy) {
      g.setAttribute('data-anchor-dy', dy);
      g.setAttribute('data-rotation', rotation);
      applyLabelTransform(g, zoom);
    }
    const useCurve = st.placement === 'curved' && bbox && rendered.some((l) => l.kind === 'name');
    const colorFor = { name: st.color, value: st.valueColor, bubble_value: st.bubbleValueColor,
      custom_value: st.customValueColor };

    for (let i = 0; i < rendered.length; i++) {
      const line = rendered[i];
      const yOffset = startY + i * lineHeight + fontSize * 0.35;
      const textAttrs = { 'font-family': st.fontFamily, 'font-size': fontSize, 'font-style': fontStyle,
        'font-weight': fontWeight, fill: colorFor[line.kind] };
      if (st.spreadCharacters) textAttrs['letter-spacing'] = '1.5px';
      if (st.haloWidth > 0) {
        Object.assign(textAttrs, { stroke: st.haloColor, 'stroke-width': st.haloWidth,
          'stroke-linejoin': 'round', 'paint-order': 'stroke fill' });
      }
      // Curved rendering applies to the name only — numbers stay straight.
      if (useCurve && line.kind === 'name') {
        const w = approxTextWidth(line.text, fontSize) * 1.05;
        const arc = Math.max(2, Math.min((bbox[3] - bbox[1]) * 0.18, w * 0.12));
        const pid = `cs-curve-${idPrefix}-${n}-${i}`;
        g.appendChild(sel('path', { id: pid, fill: 'none', stroke: 'none',
          d: `M ${-w / 2},${yOffset} Q 0,${yOffset - arc} ${w / 2},${yOffset}` }));
        const t = sel('text', textAttrs);
        const tp = sel('textPath', { href: `#${pid}`, startOffset: '50%', 'text-anchor': 'middle' });
        tp.textContent = line.text;
        t.appendChild(tp);
        g.appendChild(t);
        continue;
      }
      const t = sel('text', { ...textAttrs, 'text-anchor': 'middle', y: yOffset });
      t.textContent = line.text;
      g.appendChild(t);
    }
    layer.appendChild(g);
    n++;
  }
}

/** Screen-space label anchors derived from bubble / glyph positions. Bubbles
 *  use padX / padY so the offset survives zoom; glyphs are placed outright. */
function buildOverlayLabelOverrides(anchors, placement, fontSize, kind) {
  const out = new Map();
  const pad = 4, lineHeight = fontSize * 1.15, hGap = 36;
  for (const [pcode, a] of anchors) {
    const extent = kind === 'bubble' ? a.r : a.size;
    let dx = 0, dy = 0;
    switch (placement) {
      case 'below': dy = extent + lineHeight / 2 + pad; break;
      case 'left': dx = -(extent + hGap + pad); break;
      case 'right': dx = extent + hGap + pad; break;
      case 'center': break;
      default: dy = -(extent + lineHeight / 2 + pad);
    }
    if (kind === 'bubble') out.set(pcode, { x: a.x, y: a.y, padX: dx, padY: dy });
    else out.set(pcode, { x: a.x + dx, y: a.y + dy });
  }
  return out;
}

/* ------------------------------------------------------------ scale bar --- */
/* Port of src/render/scaleBar.ts — measures px-per-km at the viewport centre
 * so the bar stays honest at any latitude and any zoom level. */

const KM_TO_MI = 0.621371;
function niceRound(v) {
  if (!Number.isFinite(v) || v <= 0) return 1;
  const exp = Math.floor(Math.log10(v));
  const f = v / Math.pow(10, exp);
  const nice = f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10;
  return nice * Math.pow(10, exp);
}
function formatNice(v) {
  if (v >= 1000) return `${(v / 1000).toLocaleString(undefined, { maximumFractionDigits: 1 })}k`;
  if (v >= 10) return String(Math.round(v));
  return v.toLocaleString(undefined, { maximumFractionDigits: 1 });
}

function renderScaleBar(layer, projection, w, h, zoom, st) {
  clear(layer);
  if (!st.show || !projection.invert) return null;
  const centre = projection.invert([w / 2, h / 2]);
  if (!centre) return null;
  const [lon, lat] = centre;
  const kmPerDegLon = 111.32 * Math.cos((lat * Math.PI) / 180);
  if (!Number.isFinite(kmPerDegLon) || kmPerDegLon <= 0) return null;
  const east = projection([lon + 1, lat]), here = projection([lon, lat]);
  if (!east || !here) return null;
  const pxPerDegLon = Math.hypot(east[0] - here[0], east[1] - here[1]);
  if (!Number.isFinite(pxPerDegLon) || pxPerDegLon <= 0) return null;
  const pxPerKm = (pxPerDegLon / kmPerDegLon) * (zoom || 1);

  const targetPx = clamp(w * 0.18, 60, 180);
  const factor = st.units === 'mi' ? KM_TO_MI : 1;
  const niceUnits = niceRound((targetPx / pxPerKm) * factor);
  const barPx = (niceUnits / factor) * pxPerKm;
  if (!Number.isFinite(barPx) || barPx <= 8) return null;

  const fontSize = st.fontSize, labelGap = 4, barH = 6, tickH = 10;
  const box = { width: barPx + 2, height: tickH + labelGap + fontSize + 4 };
  const margin = 12;
  let x = margin, y = margin;
  if (st.position === 'topRight' || st.position === 'bottomRight') x = w - margin - box.width;
  if (st.position === 'bottomLeft' || st.position === 'bottomRight') y = h - margin - box.height;

  const root = sel('g', { class: 'cs-scalebar', transform: `translate(${x},${y})` });
  const half = barPx / 2;
  root.appendChild(sel('rect', { x: 0, y: tickH - barH, width: half, height: barH,
    fill: '#ffffff', stroke: st.color, 'stroke-width': 1 }));
  root.appendChild(sel('rect', { x: half, y: tickH - barH, width: barPx - half, height: barH,
    fill: st.color, stroke: st.color, 'stroke-width': 1 }));
  for (const tx of [0, half, barPx]) {
    root.appendChild(sel('line', { x1: tx, y1: 0, x2: tx, y2: tickH, stroke: st.color, 'stroke-width': 1 }));
  }
  const t0 = sel('text', { x: 0, y: tickH + labelGap + fontSize, 'font-size': fontSize,
    'text-anchor': 'start', fill: st.color, 'font-family': 'inherit' });
  t0.textContent = '0';
  const t1 = sel('text', { x: barPx, y: tickH + labelGap + fontSize, 'font-size': fontSize,
    'text-anchor': 'end', fill: st.color, 'font-family': 'inherit' });
  t1.textContent = `${formatNice(niceUnits)} ${st.units === 'mi' ? 'mi' : 'km'}`;
  root.append(t0, t1);
  layer.appendChild(root);
  return { width: box.width, height: box.height, position: st.position };
}

/* =============================================================== legends === */
/* Port of src/render/legend.ts. Five legends; any that share a corner are
 * stacked inside one rounded container. */

const SIZE_SCALE = { minimal: 0.6, small: 0.8, medium: 1.0, large: 1.2 };
const legendTextWidth = (text, fontSize) => String(text).length * fontSize * 0.6;

function legendText(parent, x, y, size, fill, text, extra = {}) {
  const t = sel('text', { x, y, 'font-size': size, fill, 'font-family': 'inherit', ...extra });
  t.textContent = text;
  parent.appendChild(t);
  return t;
}

function drawValueLegend(parent, v, header, item) {
  const scale = SIZE_SCALE[v.size] || 1;
  const swatch = item.swatchSize > 0 ? item.swatchSize : 14 * scale;
  const fontSize = item.fontSize > 0 ? item.fontSize : 11 * scale;
  const titleSize = header.fontSize > 0 ? header.fontSize : 12 * scale;
  const gap = 4;
  if (v.title) legendText(parent, 0, titleSize, titleSize, header.color, v.title,
    { 'font-weight': header.bold ? 600 : 400 });
  let y = titleSize + 6;

  // "Minimal" collapses a numeric ramp to a low / high pair.
  const numericOnly = v.classes.length > 0 && v.classes.every((c) => c.label == null);
  if (v.size === 'minimal' && numericOnly && v.classes.length >= 2) {
    const pairs = [{ c: v.classes[0], m: '−' }, { c: v.classes[v.classes.length - 1], m: '+' }];
    if (v.orientation === 'horizontal') {
      let x = 0;
      const colW = swatch + 6 + Math.ceil(fontSize * 0.9) + 10;
      for (const { c, m } of pairs) {
        parent.appendChild(sel('rect', { x, y, width: swatch, height: swatch, fill: c.color, stroke: '#666', 'stroke-width': 0.5 }));
        legendText(parent, x + swatch + 6, y + swatch * 0.78, fontSize, item.color, m, { 'font-weight': 700 });
        x += colW;
      }
      return;
    }
    for (const { c, m } of pairs) {
      parent.appendChild(sel('rect', { x: 0, y, width: swatch, height: swatch, fill: c.color, stroke: '#666', 'stroke-width': 0.5 }));
      legendText(parent, swatch + gap, y + swatch * 0.78, fontSize, item.color, m, { 'font-weight': 700 });
      y += swatch + gap;
    }
    return;
  }

  // Horizontal shows one number per swatch (the class's upper bound — the
  // neighbouring swatch already conveys the lower one); vertical shows the
  // whole range.
  const hLabel = (c) => (c.label != null ? c.label : fmtNumber(c.to, v.decimals, 'auto'));
  const vLabel = (c) => {
    if (c.label != null) return c.label;
    const a = fmtNumber(c.from, v.decimals, 'auto'), b = fmtNumber(c.to, v.decimals, 'auto');
    return c.from === c.to ? a : `${a} – ${b}`;
  };
  if (v.orientation === 'horizontal') {
    const labels = v.classes.map(hLabel);
    const widths = labels.map((t) => Math.max(swatch, legendTextWidth(t, fontSize)) + gap * 2);
    let x = 0;
    for (let i = 0; i < v.classes.length; i++) {
      const colW = widths[i];
      parent.appendChild(sel('rect', { x: x + (colW - swatch) / 2, y, width: swatch, height: swatch,
        fill: v.classes[i].color, stroke: '#666', 'stroke-width': 0.5 }));
      legendText(parent, x + colW / 2, y + swatch + fontSize + 2, fontSize, item.color, labels[i],
        { 'text-anchor': 'middle' });
      x += colW;
    }
    return;
  }
  for (const c of v.classes) {
    parent.appendChild(sel('rect', { x: 0, y, width: swatch, height: swatch, fill: c.color, stroke: '#666', 'stroke-width': 0.5 }));
    legendText(parent, swatch + gap, y + swatch * 0.75, fontSize, item.color, vLabel(c));
    y += swatch + gap;
  }
}

function drawSwatchLegend(parent, g, header, item, defTitle) {
  const scale = SIZE_SCALE[g.size] || 1;
  const swatch = item.swatchSize > 0 ? item.swatchSize : 12 * scale;
  const fontSize = item.fontSize > 0 ? item.fontSize : 11 * scale;
  const titleSize = header.fontSize > 0 ? header.fontSize : 12 * scale;
  const gap = 4;
  const title = g.title || defTitle;
  if (title) legendText(parent, 0, titleSize, titleSize, header.color, title, { 'font-weight': header.bold ? 600 : 400 });
  let y = (title ? titleSize + 6 : 0);
  if (g.orientation === 'horizontal') {
    let x = 0;
    for (const it of g.items) {
      parent.appendChild(sel('rect', { x, y, width: swatch, height: swatch, fill: it.color, stroke: '#666', 'stroke-width': 0.5 }));
      legendText(parent, x + swatch + 4, y + swatch * 0.8, fontSize, item.color, it.label);
      x += swatch + 4 + legendTextWidth(it.label, fontSize) + gap * 2;
    }
    return;
  }
  for (const it of g.items) {
    parent.appendChild(sel('rect', { x: 0, y, width: swatch, height: swatch, fill: it.color, stroke: '#666', 'stroke-width': 0.5 }));
    legendText(parent, swatch + gap, y + swatch * 0.8, fontSize, item.color, it.label);
    y += swatch + gap;
  }
}

/** Values legend — a `#` in each label-value colour beside its column name. */
function drawValuesLegend(parent, v, header, item) {
  const scale = SIZE_SCALE[v.size] || 1;
  const fontSize = item.fontSize > 0 ? item.fontSize : 11 * scale;
  const titleSize = header.fontSize > 0 ? header.fontSize : 12 * scale;
  const gap = 6;
  if (v.title) legendText(parent, 0, titleSize, titleSize, header.color, v.title, { 'font-weight': header.bold ? 600 : 400 });
  let y = v.title ? titleSize + 6 : 0;
  const rows = v.items.filter((it) => it && String(it.label).trim());
  if (v.orientation === 'horizontal') {
    let x = 0;
    for (const it of rows) {
      legendText(parent, x, y + fontSize, fontSize, it.color, '#', { 'font-weight': 700 });
      legendText(parent, x + fontSize * 0.8 + 4, y + fontSize, fontSize, item.color, it.label);
      x += fontSize * 0.8 + 4 + Math.max(40, legendTextWidth(it.label, fontSize)) + 14;
    }
    return;
  }
  for (const it of rows) {
    legendText(parent, 0, y + fontSize, fontSize, it.color, '#', { 'font-weight': 700 });
    legendText(parent, fontSize * 0.8 + 4, y + fontSize, fontSize, item.color, it.label);
    y += fontSize + gap;
  }
}

/** Admin levels legend — a stroke sample per level, styled from the Borders
 *  card so it always mirrors what's drawn. */
function drawLevelsLegend(parent, lv, header, item) {
  const scale = SIZE_SCALE[lv.size] || 1;
  const fontSize = item.fontSize > 0 ? item.fontSize : 11 * scale;
  const titleSize = header.fontSize > 0 ? header.fontSize : 12 * scale;
  const sampleLen = item.swatchSize > 0 ? item.swatchSize : 22 * scale;
  const gap = 6;
  if (lv.title) legendText(parent, 0, titleSize, titleSize, header.color, lv.title, { 'font-weight': header.bold ? 600 : 400 });
  let y = lv.title ? titleSize + 6 : 0;
  const horizontal = lv.orientation === 'horizontal';
  let x = 0;
  for (const it of lv.items) {
    const sampleY = y + fontSize * 0.6;
    parent.appendChild(sel('line', { x1: x, y1: sampleY, x2: x + sampleLen, y2: sampleY,
      stroke: it.color, 'stroke-width': Math.max(1, it.width), 'stroke-linecap': 'round' }));
    legendText(parent, x + sampleLen + 4, y + fontSize, fontSize, item.color, it.label);
    if (horizontal) x += sampleLen + 4 + Math.max(40, legendTextWidth(it.label, fontSize)) + 12;
    else y += fontSize + gap;
  }
}

function drawBubbleLegend(parent, b, header, item) {
  const scale = SIZE_SCALE[b.size] || 1;
  const fontSize = item.fontSize > 0 ? item.fontSize : 11 * scale;
  const titleSize = header.fontSize > 0 ? header.fontSize : 12 * scale;
  if (b.title) legendText(parent, 0, titleSize, titleSize, header.color, b.title, { 'font-weight': header.bold ? 600 : 400 });
  const yStart = (b.title ? titleSize + 8 : 0);
  const mode = b.size === 'minimal' ? 'compact' : b.orientation;
  const circle = (cx, cy, r, op) => parent.appendChild(sel('circle', { cx, cy, r,
    fill: b.fillColor, 'fill-opacity': op, stroke: b.strokeColor }));

  if (mode === 'compact') {
    const minR = Math.max(2, b.scale(b.minValue));
    const maxR = Math.max(minR + 1, b.scale(b.maxValue));
    const baseline = yStart + maxR * 2 + 2;
    const minCx = maxR;
    const gap = Math.max(36, fontSize * 3.5);
    const maxCx = minCx + maxR + gap + maxR;
    parent.appendChild(sel('line', { x1: minCx + minR + 2, y1: baseline, x2: maxCx - maxR - 2, y2: baseline,
      stroke: '#888', 'stroke-width': 1 }));
    for (const tx of [minCx + minR + 2, maxCx - maxR - 2]) {
      parent.appendChild(sel('line', { x1: tx, y1: baseline - 4, x2: tx, y2: baseline, stroke: '#888', 'stroke-width': 1 }));
    }
    circle(minCx, baseline - minR, minR, 0.7);
    circle(maxCx, baseline - maxR, maxR, 0.5);
    legendText(parent, minCx, baseline + fontSize + 4, fontSize, item.color, fmtNumber(b.minValue, 0, 'auto'), { 'text-anchor': 'middle' });
    legendText(parent, maxCx, baseline + fontSize + 4, fontSize, item.color, fmtNumber(b.maxValue, 0, 'auto'), { 'text-anchor': 'middle' });
    return;
  }
  if (mode === 'horizontal') {
    const min = b.minValue, max = b.maxValue;
    // Four steps when the range spans an order of magnitude, otherwise three.
    const steps = max > 0 && min > 0 && max / min >= 10 ? 4 : 3;
    const stops = [];
    if (max === min) stops.push(min);
    else if (steps === 3) stops.push(min, Math.sqrt(Math.max(min, 1e-9) * max), max);
    else for (let i = 0; i < 4; i++) {
      const t = i / 3;
      stops.push(min > 0 ? min * Math.pow(max / min, t) : min + (max - min) * t);
    }
    const baseline = yStart + b.maxRadius * 2 + 4;
    let x = 0;
    for (const v of stops) {
      const r = b.scale(v), cx = x + b.maxRadius;
      circle(cx, baseline - r, r, 0.6);
      legendText(parent, cx, baseline + fontSize + 4, fontSize, item.color, fmtNumber(v, 0, 'auto'), { 'text-anchor': 'middle' });
      x += b.maxRadius * 2 + Math.max(8, fontSize * 0.6);
    }
    return;
  }
  // vertical — nested circles sharing a baseline
  const cx = b.maxRadius, cyMax = yStart + b.maxRadius;
  circle(cx, cyMax, b.maxRadius, 0.4);
  circle(cx, cyMax + b.maxRadius - b.minRadius, b.minRadius, 0.7);
  legendText(parent, cx + b.maxRadius + 6, cyMax - b.maxRadius + fontSize, fontSize, item.color, fmtNumber(b.maxValue, 0, 'auto'));
  legendText(parent, cx + b.maxRadius + 6, cyMax + b.maxRadius - b.minRadius * 2 + fontSize, fontSize, item.color, fmtNumber(b.minValue, 0, 'auto'));
}

/**
 * Group every requested legend by corner, stack the ones that share a corner
 * inside a single rounded frame, then place that frame. Returns the footprint
 * per corner so callers can dodge.
 */
function renderLegends(layer, inputs, scaleBarFootprints) {
  clear(layer);
  const footprints = {};
  const groups = {};
  const put = (key, obj) => {
    if (!obj) return;
    groups[obj.position] = groups[obj.position] || {};
    groups[obj.position][key] = obj;
  };
  put('value', inputs.value); put('values', inputs.values); put('bubble', inputs.bubble);
  put('glyph', inputs.glyph); put('levels', inputs.levels);

  const c = inputs.container;
  const header = { color: c.headerColor || '#222222', bold: c.headerBold !== false, fontSize: c.headerFontSize || 0 };
  const item = { color: c.itemColor || '#1a1a1a', fontSize: c.itemFontSize || 0, swatchSize: c.itemSwatchSize || 0 };

  for (const [position, contents] of Object.entries(groups)) {
    const group = sel('g', { class: `cs-legend cs-legend-${position}` });
    const inner = sel('g', { class: 'cs-legend-inner' });
    group.appendChild(inner);
    layer.appendChild(group);

    // Stack order mirrors the map's z-order read from the top down: what sits
    // above on the map reads first in the legend.
    const stack = [];
    const addSub = (fn) => { const sub = sel('g'); inner.appendChild(sub); fn(sub); stack.push(sub); };
    if (contents.values) addSub((s) => drawValuesLegend(s, contents.values, header, item));
    if (contents.glyph) addSub((s) => drawSwatchLegend(s, contents.glyph, header, item, 'Categories'));
    if (contents.bubble) addSub((s) => drawBubbleLegend(s, contents.bubble, header, item));
    if (contents.value) addSub((s) => drawValueLegend(s, contents.value, header, item));
    if (contents.levels) addSub((s) => drawLevelsLegend(s, contents.levels, header, item));

    const horizontal = c.orientation === 'horizontal';
    let cursor = 0;
    for (const sub of stack) {
      const box = sub.getBBox();
      if (horizontal) {
        sub.setAttribute('transform', `translate(${cursor - box.x},0)`);
        cursor += box.width + 8;
      } else {
        sub.setAttribute('transform', `translate(0,${cursor - box.y})`);
        cursor += box.height + 8;
      }
    }

    const bbox = inner.getBBox();
    const pad = c.padding;
    const frame = sel('rect', { x: bbox.x - pad, y: bbox.y - pad,
      width: bbox.width + pad * 2, height: bbox.height + pad * 2,
      rx: c.cornerRadius, ry: c.cornerRadius, fill: c.background,
      'fill-opacity': c.backgroundOpacity, stroke: c.borderColor, 'stroke-width': c.borderWidth });
    inner.insertBefore(frame, inner.firstChild);

    const totalW = bbox.width + pad * 2, totalH = bbox.height + pad * 2, margin = 12;
    // Scale bar owns its corner; the legend shifts inward to clear it.
    const sbH = scaleBarFootprints?.[position]?.height || 0;
    const sbOffset = sbH ? sbH + 8 : 0;
    const xLeft = margin - bbox.x + pad;
    const xRight = inputs.width - margin - totalW - bbox.x + pad;
    const xCentre = (inputs.width - totalW) / 2 - bbox.x + pad;
    const yTop = margin - bbox.y + pad + sbOffset;
    const yBottom = inputs.height - margin - totalH - bbox.y + pad - sbOffset;
    const yMiddle = (inputs.height - totalH) / 2 - bbox.y + pad;
    const place = {
      topLeft: [xLeft, yTop], topRight: [xRight, yTop], bottomLeft: [xLeft, yBottom],
      bottomRight: [xRight, yBottom], topCenter: [xCentre, yTop], bottomCenter: [xCentre, yBottom],
      leftCenter: [xLeft, yMiddle], rightCenter: [xRight, yMiddle]
    }[position] || [xRight, yBottom];
    group.setAttribute('transform', `translate(${place[0]},${place[1]})`);
    footprints[position] = { width: totalW, height: totalH };
  }
  return footprints;
}

/* ======================================================== render pipeline == */

const svgRoot = $('#map');
const overlay = $('#overlay');
const L = {};   // named SVG layers

function setupSvg() {
  clear(svgRoot);
  L.bg = sel('rect', { x: 0, y: 0, width: '100%', height: '100%', fill: '#ffffff' });
  svgRoot.appendChild(L.bg);
  L.mapGroup = sel('g', { class: 'cs-map-group' });
  svgRoot.appendChild(L.mapGroup);
  for (const name of ['glow', 'adm2', 'adm1', 'bubble', 'glyph', 'adm2Label', 'adm1Label']) {
    L[name] = sel('g', { class: `cs-layer-${name}` });
    L.mapGroup.appendChild(L[name]);
  }
  L.static = sel('g', { class: 'cs-static' });
  svgRoot.appendChild(L.static);
  for (const name of ['scaleBar', 'legend', 'pill']) {
    L[name] = sel('g', { class: `cs-layer-${name}` });
    L.static.appendChild(L[name]);
  }
  // Everything above the polygons is decoration: clicks and hovers must fall
  // through to the choropleth so drill and tooltips work under a label.
  for (const name of ['glow', 'bubble', 'glyph', 'adm2Label', 'adm1Label', 'scaleBar', 'legend', 'pill']) {
    L[name].setAttribute('pointer-events', 'none');
  }
}

const hasGeometry = () => !!(state.geom.adm1 && state.geom.adm1.features.length);
const hasAdm2 = () => !!(state.geom.adm2 && state.geom.adm2.features.length);

function resolveView() {
  const mode = S().general.viewMode;
  if (!hasAdm2()) return 'admin1';
  if (mode === 'admin1') return 'admin1';
  if (mode === 'admin2') return 'admin2';
  return (state.drill || state.data.roles.adm2Key) ? 'admin2' : 'admin1';
}

const alias1 = () => (S().general.admin1Alias || '').trim() || 'Admin 1';
const alias2 = () => (S().general.admin2Alias || '').trim() || 'Admin 2';

function admin1NameFor(pcode) {
  const f = (state.geom.adm1?.features || []).find((x) => x.properties.ADM1_PCODE === pcode);
  return f ? (f.properties.ADM1_EN || f.properties.ADM1_PCODE || pcode) : pcode;
}
function admin1NavOrder() {
  return (state.geom.adm1?.features || [])
    .map((f) => ({ p: f.properties.ADM1_PCODE, n: f.properties.ADM1_EN || f.properties.ADM1_PCODE || '' }))
    .filter((x) => x.p)
    .sort((a, b) => String(a.n).localeCompare(String(b.n), undefined, { numeric: true }))
    .map((x) => x.p);
}

function render() {
  const wrap = $('#canvasWrap');
  const width = state.viewportW = Math.max(80, wrap.clientWidth);
  const height = state.viewportH = Math.max(80, wrap.clientHeight);
  svgRoot.setAttribute('viewBox', `0 0 ${width} ${height}`);

  const st = S();
  const bgColor = st.general.transparentBackground ? 'none' : st.general.background;
  L.bg.setAttribute('fill', bgColor === 'none' ? 'transparent' : bgColor);

  $('#empty').style.display = hasGeometry() ? 'none' : '';
  if (!hasGeometry()) {
    for (const k of ['glow', 'adm2', 'adm1', 'bubble', 'glyph', 'adm2Label', 'adm1Label', 'scaleBar', 'legend', 'pill']) clear(L[k]);
    clear(overlay);
    state.last = null;
    refreshChromeState();
    return;
  }

  const view = resolveView();
  const { areas, stats } = getAreas();
  state.joinStats = stats;
  const adm1Level = Array.from(areas.values()).some((a) => a.level === 1) ? areas : aggregateToAdmin1(areas);

  const adm1All = state.geom.adm1.features;
  const adm2All = state.geom.adm2?.features || [];
  let adm1Visible = adm1All;
  let adm2Visible = view === 'admin2' ? adm2All : [];
  if (state.drill) {
    if (view === 'admin2') adm2Visible = adm2All.filter((f) => f.properties.ADM1_PCODE === state.drill);
    if (st.general.hideUnfocused) adm1Visible = adm1All.filter((f) => f.properties.ADM1_PCODE === state.drill);
  }

  // Projection fits whatever the reader is focused on: drilled children first,
  // then the visible Admin2 set, then Admin1.
  let fitFeatures = adm1Visible;
  if (state.drill) {
    fitFeatures = view === 'admin2' && adm2Visible.length
      ? adm2Visible
      : adm1All.filter((f) => f.properties.ADM1_PCODE === state.drill);
  } else if (view === 'admin2' && adm2Visible.length) {
    fitFeatures = adm2Visible;
  }
  if (!fitFeatures.length) fitFeatures = adm1All;
  const { projection, path } = buildProjection({ type: 'FeatureCollection', features: fitFeatures },
    width, height, st.general.padding);

  /* ---- classification -------------------------------------------------- */
  const pcodeKey = view === 'admin2' ? 'ADM2_PCODE' : 'ADM1_PCODE';
  const visibleFeatures = view === 'admin2' ? adm2Visible : adm1Visible;
  const lookup = view === 'admin2' ? areas : adm1Level;
  // PCODE-format-tolerant secondary index, so "sd_01" still finds "SD01".
  const normLookup = new Map();
  lookup.forEach((datum, key) => {
    const n = normKey(key);
    if (n && !normLookup.has(n)) normLookup.set(n, datum);
  });
  const datumFor = (f) => {
    const raw = f.properties[pcodeKey];
    return lookup.get(raw) || normLookup.get(normKey(raw)) || null;
  };
  const valued = visibleFeatures.map((f) => ({ feature: f, datum: datumFor(f) }));

  const cs = st.choropleth;
  const isBlank = (v) => v == null || (cs.zeroAsBlank && v === 0);
  // "Classify on: all features" keeps one colour scale across drill levels so
  // a shade means the same thing before and after you drill in.
  const classifySet = cs.classifyScope === 'all'
    ? (view === 'admin2' ? adm2All : adm1All).map((f) => ({ feature: f, datum: datumFor(f) }))
    : valued;
  const colorValues = classifySet.map((v) => v.datum?.colorValue).filter((v) => !isBlank(v));
  const breaks = buildBreaks(colorValues, cs.classification, cs.classCount, cs.manualBreaks);
  const customColors = [cs.color1, cs.color2, cs.color3, cs.color4, cs.color5, cs.color6, cs.color7];
  const colors = cs.mode === 'custom'
    ? customColors.slice(0, Math.max(1, breaks.classCount))
    : rampColors(cs.baseColor, Math.max(1, breaks.classCount));
  const blankFill = cs.blankTransparent ? 'transparent' : cs.blankColor;

  // Categorical: unique raw values in natural order (so "Severity 10" follows
  // "Severity 9"), cycling through the custom class colours.
  let categoryColors = null, categoricalClasses = null;
  if (cs.classification === 'categorical') {
    const seen = new Set(), cats = [];
    for (const v of classifySet) {
      const raw = v.datum?.colorValueRaw;
      if (raw == null || raw === '') continue;
      const k = String(raw);
      if (!seen.has(k)) { seen.add(k); cats.push(k); }
    }
    cats.sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    categoryColors = new Map();
    categoricalClasses = cats.map((cat, i) => {
      const color = customColors[i % customColors.length];
      categoryColors.set(cat, color);
      return { color, label: cat };
    });
  }

  const fillFor = (datum) => {
    if (!cs.show) return 'none';
    if (cs.classification === 'categorical') {
      const raw = datum?.colorValueRaw;
      const key = raw == null ? null : String(raw);
      return key && categoryColors?.has(key) ? categoryColors.get(key) : blankFill;
    }
    const v = datum?.colorValue;
    return !isBlank(v) ? colors[Math.min(colors.length - 1, classIndex(breaks.breaks, v))] : blankFill;
  };

  /* ---- rows ------------------------------------------------------------ */
  const dimmed = (pcode) => !!state.drill && pcode !== state.drill;
  const rows = valued.map(({ feature, datum }) => ({
    feature, datum, pcode: feature.properties[pcodeKey],
    fill: fillFor(datum), fillOpacity: cs.show ? cs.fillOpacity : 0
  }));

  let adm1Rows, adm2Rows;
  if (view === 'admin1') {
    adm1Rows = rows.map((r) => ({ ...r,
      fillOpacity: r.fillOpacity * (dimmed(r.pcode) ? 0.55 : 1) }));
    adm2Rows = [];
  } else {
    // Admin2 carries the choropleth; Admin1 exists for borders and, when
    // drilled, to mute the surrounding context.
    adm1Rows = adm1Visible.map((f) => {
      const p = f.properties.ADM1_PCODE;
      const dim = dimmed(p);
      return { feature: f, datum: adm1Level.get(p) || null, pcode: p,
        fill: dim ? blankFill : 'none', fillOpacity: dim ? 0.55 : 0 };
    });
    adm2Rows = rows;
  }

  /* ---- draw ------------------------------------------------------------ */
  renderGlow(L.glow, path, adm1Visible, st.borders);
  const adm2Nodes = renderChoropleth(L.adm2, path, adm2Rows, 'cs-adm2');
  const adm1Nodes = renderChoropleth(L.adm1, path, adm1Rows, 'cs-adm1');
  for (const n of adm1Nodes) {
    n.__dim = dimmed(n.__row.pcode);
    // In Admin 2 view the Admin 1 layer is drawn on top for its borders, so it
    // must let clicks through to the children below. Dimmed neighbours have no
    // children under them and stay clickable, which is how you hop states.
    n.style.pointerEvents = view === 'admin2' && !n.__dim ? 'none' : '';
  }
  applyBorders(L.adm1, L.adm2, st.borders);

  const glyphResult = renderGlyphs(L.glyph, projection, visibleFeatures, lookup, pcodeKey,
    { ...st.glyphChart, colors: [st.glyphChart.color1, st.glyphChart.color2, st.glyphChart.color3,
      st.glyphChart.color4, st.glyphChart.color5, st.glyphChart.color6, st.glyphChart.color7,
      st.glyphChart.color8] }, state.zoom);
  const bubbleResult = renderBubbles(L.bubble, projection, visibleFeatures, lookup, pcodeKey,
    st.bubbles, state.zoom);

  /* ---- labels ---------------------------------------------------------- */
  const localityCard = state.drill ? st.drillLabels : st.localityLabels;
  const overlayAnchors = glyphResult?.anchors?.size
    ? { anchors: glyphResult.anchors, placement: st.glyphChart.labelPlacement, kind: 'glyph' }
    : (bubbleResult ? { anchors: bubbleResult.anchors, placement: st.bubbles.labelPlacement, kind: 'bubble' } : null);

  const adm1Holes = buildVirtualHoles(adm1Visible, 'ADM1_PCODE');
  const adm2Holes = buildVirtualHoles(adm2Visible, 'ADM2_PCODE');
  const labelDatum = (f, key, nameKey, table) => {
    const datum = table.get(f.properties[key]) || normLookup.get(normKey(f.properties[key])) || null;
    return { feature: f, pcode: f.properties[key],
      name: f.properties[nameKey] || f.properties[key] || '',
      nameOverride: datum?.labelText1 ?? null, value: datum?.colorValue ?? null,
      value2: datum?.labelValue2 ?? null, bubbleValue: datum?.bubbleSize ?? null };
  };

  clear(L.adm1Label); clear(L.pill);
  if (st.stateLabels.show) {
    const isDrill = !!state.drill;
    const group = sel('g', { class: 'cs-adm1-labels' });
    if (isDrill) group.setAttribute('opacity', '0.55');
    L.adm1Label.appendChild(group);
    const features = isDrill ? adm1Visible.filter((f) => f.properties.ADM1_PCODE !== state.drill) : adm1Visible;
    const labels = features.map((f) => labelDatum(f, 'ADM1_PCODE', 'ADM1_EN', adm1Level));
    // In drill view the neighbours read as context: names only, and dropped
    // outright if they cannot fit inside their own polygon.
    const style = isDrill
      ? { ...st.stateLabels, content: 'name', allowOverrun: false, hideOnOverflow: true }
      : st.stateLabels;
    let forbidden = null;
    if (isDrill) {
      const focused = adm1All.find((f) => f.properties.ADM1_PCODE === state.drill);
      const ring = focused && largestProjectedOuterRing(focused.geometry, projection);
      if (ring && ring.length >= 3) forbidden = ring;
    }
    renderLabels(group, projection, path, labels, style, {
      overrides: view === 'admin1' && overlayAnchors
        ? buildOverlayLabelOverrides(overlayAnchors.anchors, overlayAnchors.placement, st.stateLabels.fontSize, overlayAnchors.kind)
        : null,
      zoom: state.zoom, forbiddenPolygon: forbidden, virtualHoles: adm1Holes, idPrefix: 'a1' });

    if (isDrill) {
      const focused = adm1All.find((f) => f.properties.ADM1_PCODE === state.drill);
      if (focused) renderDrillPill(width, focused, adm1Level.get(state.drill));
    }
  }

  if (view === 'admin2' && localityCard.show && adm2Visible.length) {
    const labels = adm2Visible.map((f) => labelDatum(f, 'ADM2_PCODE', 'ADM2_EN', areas));
    renderLabels(L.adm2Label, projection, path, labels, localityCard, {
      overrides: overlayAnchors
        ? buildOverlayLabelOverrides(overlayAnchors.anchors, overlayAnchors.placement, localityCard.fontSize, overlayAnchors.kind)
        : null,
      zoom: state.zoom, virtualHoles: adm2Holes, idPrefix: 'a2' });
  } else {
    clear(L.adm2Label);
  }

  /* ---- scale bar + legends --------------------------------------------- */
  const sbFootprint = renderScaleBar(L.scaleBar, projection, width, height, state.zoom, st.scaleBar);
  // Corners that are already spoken for, so legends can shift clear of them.
  const dodge = {};
  if (sbFootprint) dodge[sbFootprint.position] = { height: sbFootprint.height };
  // The attribution badge sits bottom-right and would otherwise clip a legend.
  if (VIEW_ONLY) dodge.bottomRight = { height: (dodge.bottomRight?.height || 0) + 22 };
  const sbByCorner = Object.keys(dodge).length ? dodge : undefined;

  let valueClasses = cs.classification === 'categorical'
    ? (categoricalClasses || []).map((c) => ({ color: c.color, from: 0, to: 0, label: c.label }))
    : (breaks.classCount > 0 ? makeLegendClasses(breaks, colors) : []);
  // Only claim "No data" in the legend when a polygon is actually painted with
  // the no-data colour — and never in transparent mode, where the user has
  // chosen for blanks to be invisible.
  if (!cs.blankTransparent && valueClasses.length && rows.some((r) => r.fill === cs.blankColor)) {
    valueClasses = valueClasses.concat([{ color: cs.blankColor, from: 0, to: 0, label: 'No data' }]);
  }
  const roles = state.data.roles;
  const glyphColors = [st.glyphChart.color1, st.glyphChart.color2, st.glyphChart.color3, st.glyphChart.color4,
    st.glyphChart.color5, st.glyphChart.color6, st.glyphChart.color7, st.glyphChart.color8];

  const legendInputs = {
    width, height,
    value: (cs.show && st.valueLegend.show && valueClasses.length) ? {
      title: st.valueLegend.title || roles.colorValue || '',
      classes: valueClasses, decimals: st.valueLegend.decimals,
      orientation: st.valueLegend.orientation, position: st.valueLegend.position, size: st.valueLegend.size
    } : null,
    bubble: (st.bubbleLegend.show && bubbleResult) ? {
      title: st.bubbleLegend.title || roles.bubbleSize || '',
      fillColor: st.bubbles.fillColor, strokeColor: st.bubbles.strokeColor,
      minRadius: st.bubbles.minRadius, maxRadius: st.bubbles.maxRadius,
      minValue: bubbleResult.minValue, maxValue: bubbleResult.maxValue, scale: bubbleResult.scale,
      position: st.bubbleLegend.position, size: st.bubbleLegend.size, orientation: st.bubbleLegend.orientation
    } : null,
    glyph: (st.glyphLegend.show && st.glyphChart.show && roles.glyphValues.length) ? {
      title: st.glyphLegend.title, items: roles.glyphValues.map((c, i) => ({ label: c, color: glyphColors[i % 8] })),
      orientation: st.glyphLegend.orientation, position: st.glyphLegend.position, size: st.glyphLegend.size
    } : null,
    values: buildValuesLegendInput(view),
    levels: buildLevelsLegendInput(),
    container: { ...st.legendContainer, orientation: st.legendContainer.containerOrientation }
  };
  renderLegends(L.legend, legendInputs, sbByCorner);

  /* ---- chrome + interaction -------------------------------------------- */
  applyZoom();
  renderChrome(view);
  refreshChromeState();
  wireInteraction(adm1Nodes, adm2Nodes, view, adm1Level, areas);

  state.last = { projection, view, areas, adm1Level, legendInputs };
  refreshJoinStatus();
}

/** Top-bar affordances that depend on what is loaded. */
function refreshChromeState() {
  if (VIEW_ONLY) return;
  const share = $('#btnShare');
  if (share) {
    share.disabled = !hasGeometry();
    share.title = hasGeometry() ? 'Share or embed this map' : 'Upload geometry first';
  }
  const adopt = $('#miAdopt');
  if (adopt) adopt.hidden = !foreignProject;
}

/** Values legend payload — one `#` row per active label-value source. */
function buildValuesLegendInput(view) {
  const st = S(), card = st.valuesLegend;
  if (!card.show) return null;
  const labelCard = view === 'admin2' ? (state.drill ? st.drillLabels : st.localityLabels) : st.stateLabels;
  if (labelCard.content === 'name') return null;   // no value text is drawn anywhere
  const want = valueSourceFlags(labelCard.valueSource);
  const roles = state.data.roles;
  const items = [];
  if (want.choropleth && roles.colorValue) items.push({ label: roles.colorValue, color: labelCard.valueColor });
  if (want.bubble && roles.bubbleSize) items.push({ label: roles.bubbleSize, color: labelCard.bubbleValueColor });
  if (want.custom && roles.labelValue2) items.push({ label: roles.labelValue2, color: labelCard.customValueColor });
  if (!items.length) return null;
  return { title: card.title, items, position: card.position, size: card.size, orientation: card.orientation };
}

function buildLevelsLegendInput() {
  const st = S(), card = st.adminLevelsLegend;
  if (!card.show) return null;
  const items = [];
  if (card.showAdmin1) items.push({ label: alias1(), color: st.borders.stateColor, width: st.borders.stateWidth });
  if (card.showAdmin2 && hasAdm2()) items.push({ label: alias2(), color: st.borders.localityColor, width: st.borders.localityWidth });
  if (!items.length) return null;
  return { title: card.title, items, position: card.position, size: card.size, orientation: card.orientation };
}

/** Drill title pill — drawn in SVG (not HTML chrome) so it survives export. */
function renderDrillPill(width, feature, datum) {
  const st = S();
  if (st.general.hideChrome) return;
  const name = feature.properties.ADM1_EN || feature.properties.ADM1_PCODE;
  const lines = [{ text: name, size: 15, weight: 700, color: '#1d2129' }];
  const roles = state.data.roles;
  if (datum?.colorValue != null && roles.colorValue) {
    lines.push({ text: `${roles.colorValue}: ${fmtNumber(datum.colorValue, 0, 'auto')}`, size: 11.5, weight: 400, color: '#5a6472' });
  }
  if (datum?.bubbleSize != null && roles.bubbleSize) {
    lines.push({ text: `${roles.bubbleSize}: ${fmtNumber(datum.bubbleSize, 0, 'auto')}`, size: 11.5, weight: 400, color: '#5a6472' });
  }
  const padX = 14, padY = 8;
  const w = Math.max(...lines.map((l) => approxTextWidth(l.text, l.size))) + padX * 2;
  const h = lines.reduce((a, l) => a + l.size * 1.35, 0) + padY * 2;
  const x = (width - w) / 2, y = 12;
  const g = sel('g', { class: 'cs-pill', transform: `translate(${x},${y})` });
  g.appendChild(sel('rect', { x: 0, y: 0, width: w, height: h, rx: 8, ry: 8,
    fill: '#ffffff', 'fill-opacity': 0.92, stroke: '#dde1e8', 'stroke-width': 1 }));
  let cy = padY;
  for (const l of lines) {
    cy += l.size;
    const t = sel('text', { x: w / 2, y: cy, 'text-anchor': 'middle', 'font-size': l.size,
      'font-weight': l.weight, fill: l.color, 'font-family': 'inherit' });
    t.textContent = l.text;
    g.appendChild(t);
    cy += l.size * 0.35;
  }
  L.pill.appendChild(g);
}

/* --------------------------------------------------------------- zoom ----- */

function applyZoom() {
  const z = state.zoom, cx = state.viewportW / 2, cy = state.viewportH / 2;
  L.mapGroup.setAttribute('transform',
    `translate(${cx + state.panX},${cy + state.panY}) scale(${z}) translate(${-cx},${-cy})`);
  updateLabelTransforms(L.adm1Label, z);
  updateLabelTransforms(L.adm2Label, z);
  updateCounterZoom(L.bubble, z);
  updateCounterZoom(L.glyph, z);
  svgRoot.style.cursor = z > 1.001 ? (dragState ? 'grabbing' : 'grab') : '';
}

function setZoom(z, focal) {
  const next = clamp(z, 0.4, 40);
  if (focal) {
    // Keep the point under the cursor pinned while the scale changes.
    const cx = state.viewportW / 2, cy = state.viewportH / 2;
    state.panX = focal[0] - cx - (next / state.zoom) * (focal[0] - cx - state.panX);
    state.panY = focal[1] - cy - (next / state.zoom) * (focal[1] - cy - state.panY);
  }
  state.zoom = next;
  applyZoom();
  // The scale bar's labelled distance depends on zoom; legends do not move.
  if (state.last) {
    renderScaleBar(L.scaleBar, state.last.projection, state.viewportW, state.viewportH, state.zoom, S().scaleBar);
  }
  renderControls();
}
function resetView() { state.zoom = 1; state.panX = 0; state.panY = 0; setZoom(1); }

/* ------------------------------------------------------- on-canvas chrome - */

function renderChrome(view) {
  clear(overlay);
  if (S().general.hideChrome) return;
  renderNavBar(view);
  renderControls();
}

function iconBtn(svgHtml, label, onClick, disabled) {
  const b = el('button', { type: 'button', title: label, 'aria-label': label, html: svgHtml });
  if (disabled) b.disabled = true;
  else b.addEventListener('click', (e) => { e.stopPropagation(); onClick(); });
  return b;
}

const ICON_HOME = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.5 8 3l6 5.5"/><path d="M3.5 7.5V13h9V7.5"/></svg>';

function renderNavBar(view) {
  if (!state.drill) return;
  const w = state.viewportW;
  const mode = w >= 560 ? 'large' : (w < 340 ? 'small' : 'medium');
  const bar = el('div', { class: `cs-topbar-map ${mode}` });

  bar.appendChild(iconBtn(
    mode === 'large' ? `${ICON_HOME}<span>Full view</span>` : ICON_HOME,
    'Back to full view', () => { state.drill = null; resetView(); render(); }));

  const order = admin1NavOrder();
  const idx = order.indexOf(state.drill);
  const canCycle = order.length > 1 && idx >= 0;
  const prev = canCycle ? order[(idx - 1 + order.length) % order.length] : null;
  const next = canCycle ? order[(idx + 1) % order.length] : null;
  bar.appendChild(iconBtn('&#8249;', prev ? `Previous ${alias1()} (${admin1NameFor(prev)})` : 'Previous',
    () => { state.drill = prev; render(); }, !prev));
  bar.appendChild(iconBtn('&#8250;', next ? `Next ${alias1()} (${admin1NameFor(next)})` : 'Next',
    () => { state.drill = next; render(); }, !next));

  // The large layout puts the name in the SVG pill; narrower viewports show it
  // inline here instead so the bar still says where you are.
  if (mode !== 'large') bar.appendChild(el('span', { class: 'title', text: admin1NameFor(state.drill) }));
  overlay.appendChild(bar);
}

function renderControls() {
  overlay.querySelector('.cs-controls')?.remove();
  const c = S().controls;
  const panel = el('div', { class: 'cs-controls' });
  panel.dataset.pos = c.position;
  if (c.showPan) {
    const mk = (dir, glyph, label) => iconBtn(glyph, label, () => {
      const step = 60;
      if (dir === 'up') state.panY += step; if (dir === 'down') state.panY -= step;
      if (dir === 'left') state.panX += step; if (dir === 'right') state.panX -= step;
      applyZoom(); renderControls();
    });
    const rowT = el('div', { class: 'cs-pan-row' }, mk('up', '&#9650;', 'Pan up'));
    const rowM = el('div', { class: 'cs-pan-row' }, mk('left', '&#9664;', 'Pan left'), mk('right', '&#9654;', 'Pan right'));
    const rowB = el('div', { class: 'cs-pan-row' }, mk('down', '&#9660;', 'Pan down'));
    panel.append(rowT, rowM, rowB);
  }
  if (c.showZoom) {
    panel.appendChild(iconBtn('+', 'Zoom in', () => setZoom(state.zoom * 1.25)));
    panel.appendChild(iconBtn('&#8722;', 'Zoom out', () => setZoom(state.zoom / 1.25)));
  }
  if (state.zoom > 1.001 || state.panX || state.panY) {
    panel.appendChild(iconBtn('&#8634;', 'Reset zoom and pan', () => resetView()));
  }
  if (panel.children.length) overlay.appendChild(panel);
}

/* -------------------------------------------------------- interaction ----- */

let dragState = null;

function wireInteraction(adm1Nodes, adm2Nodes, view, adm1Level, areas) {
  const c = S().controls;
  const tip = $('#tip');
  const showTip = (evt, row, table, isAdmin2) => {
    if (!c.showTooltip) return;
    const datum = row.datum || table.get(row.pcode);
    const f = row.feature.properties;
    const name = isAdmin2 ? (f.ADM2_EN || f.ADM2_PCODE) : (f.ADM1_EN || f.ADM1_PCODE);
    const roles = state.data.roles;
    const lines = [];
    const seen = new Set();
    // One row per label — binding the same column to two roles shouldn't
    // produce the same line twice.
    const push = (label, value) => {
      if (value == null || value === '' || seen.has(label)) return;
      seen.add(label);
      lines.push([label, value]);
    };
    push(isAdmin2 ? alias2() : alias1(), name);
    if (row.pcode) push('Code', row.pcode);
    if (roles.colorValue && datum?.colorValue != null) push(roles.colorValue, fmtNumber(datum.colorValue, 2, 'auto'));
    if (roles.bubbleSize && datum?.bubbleSize != null) push(roles.bubbleSize, fmtNumber(datum.bubbleSize, 2, 'auto'));
    if (roles.labelValue2 && datum?.labelValue2 != null) push(roles.labelValue2, fmtNumber(datum.labelValue2, 2, 'auto'));
    roles.glyphValues.forEach((col, i) => {
      if (datum?.glyphValues?.[i] != null) push(col, fmtNumber(datum.glyphValues[i], 2, 'auto'));
    });
    for (const t of (datum?.tooltips || [])) push(t.label, t.value);
    tip.innerHTML = `<b>${esc(lines[0][1])}</b>` +
      lines.slice(1).map(([k, v]) => `<div class="r"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join('');
    tip.classList.add('show');
    moveTip(evt);
  };
  const moveTip = (evt) => {
    const wrap = $('#canvasWrap').getBoundingClientRect();
    let x = evt.clientX - wrap.left + 14, y = evt.clientY - wrap.top + 14;
    if (x + tip.offsetWidth > wrap.width - 8) x = evt.clientX - wrap.left - tip.offsetWidth - 12;
    if (y + tip.offsetHeight > wrap.height - 8) y = evt.clientY - wrap.top - tip.offsetHeight - 12;
    tip.style.left = `${x}px`; tip.style.top = `${y}px`;
  };
  const hideTip = () => tip.classList.remove('show');

  const bind = (nodes, table, isAdmin2) => {
    for (const n of nodes) {
      n.addEventListener('mouseenter', (e) => showTip(e, n.__row, table, isAdmin2));
      n.addEventListener('mousemove', moveTip);
      n.addEventListener('mouseleave', hideTip);
    }
  };
  bind(adm1Nodes, adm1Level, false);
  bind(adm2Nodes, areas, true);

  const drillTo = (pcode) => {
    if (!pcode) return;
    state.drill = state.drill === pcode ? null : pcode;
    hideTip();
    resetView();
    render();
  };
  if (c.drillOnClick) {
    for (const n of adm1Nodes) {
      n.style.cursor = 'pointer';
      n.addEventListener('click', (e) => {
        if (dragState?.moved) return;
        e.stopPropagation();
        drillTo(n.__row.pcode);
      });
    }
    // Admin 2 polygons drill into their parent, so the Admin 2 view is not a
    // dead end when the user lands there straight from the bindings.
    if (!state.drill) {
      for (const n of adm2Nodes) {
        n.style.cursor = 'pointer';
        n.addEventListener('click', (e) => {
          if (dragState?.moved) return;
          e.stopPropagation();
          drillTo(n.__row.feature.properties.ADM1_PCODE);
        });
      }
    }
  }
}

function wireCanvasGestures() {
  const wrap = $('#canvasWrap');
  wrap.addEventListener('wheel', (e) => {
    if (!S().controls.wheelZoom || !hasGeometry()) return;
    e.preventDefault();
    const r = wrap.getBoundingClientRect();
    setZoom(state.zoom * (e.deltaY < 0 ? 1.12 : 1 / 1.12), [e.clientX - r.left, e.clientY - r.top]);
  }, { passive: false });

  // Drag-pan listens on the window rather than capturing the pointer: pointer
  // capture would retarget the follow-up `click` to the canvas and swallow the
  // drill-on-click on the polygon underneath.
  const onMove = (e) => {
    if (!dragState) return;
    const dx = e.clientX - dragState.x, dy = e.clientY - dragState.y;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragState.moved = true;
    state.panX = dragState.panX + dx;
    state.panY = dragState.panY + dy;
    applyZoom();
  };
  const onUp = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    if (!dragState) return;
    // Keep `moved` readable by the click handler that fires right after.
    setTimeout(() => { dragState = null; applyZoom(); renderControls(); }, 0);
    if (dragState.moved) renderControls();
  };
  wrap.addEventListener('pointerdown', (e) => {
    if (!S().controls.dragPan || e.button !== 0 || !hasGeometry()) return;
    dragState = { x: e.clientX, y: e.clientY, panX: state.panX, panY: state.panY, moved: false };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    svgRoot.style.cursor = 'grabbing';
  });

  // Drag-and-drop onto the canvas: the first geometry file wins, tabular files
  // go to the data slot.
  wrap.addEventListener('dragover', (e) => { e.preventDefault(); wrap.classList.add('dragover'); });
  wrap.addEventListener('dragleave', () => wrap.classList.remove('dragover'));
  wrap.addEventListener('drop', async (e) => {
    e.preventDefault();
    wrap.classList.remove('dragover');
    for (const file of Array.from(e.dataTransfer.files || [])) {
      if (/\.(geojson|topojson|json)$/i.test(file.name)) {
        await loadGeometryFile(file, hasGeometry() ? 2 : 1);
      } else if (/\.(csv|tsv|txt|xlsx|xlsm|xlsb|xls)$/i.test(file.name)) {
        await loadDataFile(file);
      }
    }
  });
}

/* ============================================================== data UI ==== */

const NONE = '(none)';

function selectEl(options, current, onChange, { allowNone = true, noneLabel = NONE } = {}) {
  const s = el('select');
  if (allowNone) s.appendChild(el('option', { value: '', text: noneLabel }));
  for (const opt of options) {
    const [value, label] = Array.isArray(opt) ? opt : [opt, opt];
    s.appendChild(el('option', { value, text: label, selected: String(value) === String(current) }));
  }
  s.value = current == null ? '' : String(current);
  s.addEventListener('change', () => onChange(s.value));
  return s;
}

function fileButton(label, accept, onFile) {
  const input = el('input', { type: 'file', accept });
  input.addEventListener('change', async () => {
    const f = input.files?.[0];
    input.value = '';
    if (f) await onFile(f);
  });
  return el('label', { class: 'filebtn' }, label, input);
}

function readFileText(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result));
    r.onerror = () => reject(new Error(`Could not read ${file.name}`));
    r.readAsText(file);
  });
}

async function loadGeometryFile(file, level) {
  try {
    if (file.size > 90 * 1024 * 1024) throw new Error(`${file.name} is larger than 90 MB — simplify it first (mapshaper.org)`);
    const text = await readFileText(file);
    const fc = parseGeometryText(text, file.name);
    const flipped = rewindFeatureCollection(fc);   // always, on every upload
    invalidateAreas();
    const props = collectPropertyNames(fc);
    const g = state.geom;
    if (level === 1) {
      g.adm1 = fc; g.adm1Name = file.name; g.adm1Props = props;
      g.mapping.adm1Pcode = guessField(props, 'adm1Pcode') || guessField(props, 'adm1Name');
      g.mapping.adm1Name = guessField(props, 'adm1Name');
      if (!g.mapping.adm1Pcode && props.length) g.mapping.adm1Pcode = props[0];
      applyMapping(fc, 1, g.mapping);
      if (!S().general.admin1LinkField) setSetting('general', 'admin1LinkField', 'ADM1_PCODE', false);
    } else {
      g.adm2 = fc; g.adm2Name = file.name; g.adm2Props = props;
      g.mapping.adm2Pcode = guessField(props, 'adm2Pcode') || guessField(props, 'adm2Name');
      g.mapping.adm2Name = guessField(props, 'adm2Name');
      g.mapping.adm2Parent = guessField(props, 'adm1Pcode');
      applyMapping(fc, 2, g.mapping);
    }
    toast(`${file.name}: ${fc.features.length} features loaded` +
      (flipped ? `, ${flipped} ring${flipped === 1 ? '' : 's'} rewound to d3-geo winding` : ''));
    state.drill = null;
    resetView();
    buildDataPanel();
    buildFormatPanel();
    render();
    saveLocal(true);
  } catch (e) {
    toast(e.message || String(e), true);
  }
}

async function loadDataFile(file) {
  try {
    let parsed;
    if (/\.(xlsx|xlsm|xlsb|xls)$/i.test(file.name)) parsed = await parseWorkbookFile(file);
    else parsed = parseDelimitedText(await readFileText(file), file.name);
    if (!parsed) return;   // the sheet picker was cancelled
    adoptData(parsed, parsed.label || file.name);
  } catch (e) {
    toast(e.message || String(e), true);
  }
}

function adoptData(parsed, fileName) {
  invalidateAreas();
  state.data.rows = parsed.rows;
  state.data.columns = parsed.columns;
  state.data.fileName = fileName;
  const inferred = inferRoles(parsed.columns, parsed.rows);
  // Keep the user's existing bindings when the new file still has those
  // columns — re-uploading a corrected export shouldn't reset the design.
  const keep = (v) => (Array.isArray(v) ? v.filter((c) => parsed.columns.includes(c))
    : (parsed.columns.includes(v) ? v : ''));
  const r = state.data.roles;
  state.data.roles = {
    adm1Key: keep(r.adm1Key) || inferred.adm1Key,
    adm2Key: keep(r.adm2Key) || inferred.adm2Key,
    colorValue: keep(r.colorValue) || inferred.colorValue,
    bubbleSize: keep(r.bubbleSize), glyphValues: keep(r.glyphValues),
    labelValue2: keep(r.labelValue2), labelText1: keep(r.labelText1), tooltips: keep(r.tooltips)
  };
  toast(`${fileName}: ${parsed.rows.length} rows × ${parsed.columns.length} columns`);
  buildDataPanel();
  render();
  saveLocal(true);
}

function group(title, badge) {
  const g = el('div', { class: 'grp' });
  const h = el('h4', {}, title);
  if (badge) h.appendChild(el('span', { class: `badge ${badge.ok ? 'ok' : ''}`, text: badge.text }));
  g.appendChild(h);
  return g;
}

function mapRow(label, options, current, onChange) {
  return el('div', { class: 'row' }, el('label', { text: label }),
    el('div', { class: 'ctl' }, selectEl(options, current, onChange)));
}

function buildDataPanel() {
  if (VIEW_ONLY) return;   // no panels to build — the map is the whole page
  const panel = clear($('#panelData'));
  const g = state.geom;

  /* ---- Admin 1 geometry ------------------------------------------------ */
  const g1 = group(`Geometry — ${alias1()}`, g.adm1 ? { text: `${g.adm1.features.length} features`, ok: true } : { text: 'required' });
  if (!g.adm1) {
    g1.appendChild(fileButton('Upload Admin 1 GeoJSON / TopoJSON', '.geojson,.json,.topojson',
      (f) => loadGeometryFile(f, 1)));
  } else {
    g1.appendChild(el('div', { class: 'filename' }, el('span', { text: g.adm1Name }),
      el('button', { class: 'x', title: 'Remove', text: '✕', onclick: () => {
        g.adm1 = null; g.adm2 = null; g.adm1Props = []; g.adm2Props = [];
        state.drill = null; buildDataPanel(); render(); saveLocal(true);
      } })));
    g1.appendChild(mapRow(`${alias1()} join key`, g.adm1Props, g.mapping.adm1Pcode,
      (v) => { g.mapping.adm1Pcode = v; applyMapping(g.adm1, 1, g.mapping); render(); saveLocal(true); }));
    g1.appendChild(mapRow(`${alias1()} name`, g.adm1Props, g.mapping.adm1Name,
      (v) => { g.mapping.adm1Name = v; applyMapping(g.adm1, 1, g.mapping); render(); saveLocal(true); }));
    const missing = g.adm1.features.filter((f) => !f.properties.ADM1_PCODE).length;
    if (missing) g1.appendChild(el('div', { class: 'hint warn',
      text: `${missing} feature${missing === 1 ? '' : 's'} have no value for the join key.` }));
  }
  panel.appendChild(g1);

  /* ---- Admin 2 geometry ------------------------------------------------ */
  if (g.adm1) {
    const g2 = group(`Geometry — ${alias2()}`, g.adm2 ? { text: `${g.adm2.features.length} features`, ok: true } : { text: 'optional' });
    if (!g.adm2) {
      g2.appendChild(fileButton('Upload Admin 2 GeoJSON / TopoJSON', '.geojson,.json,.topojson',
        (f) => loadGeometryFile(f, 2)));
    } else {
      g2.appendChild(el('div', { class: 'filename' }, el('span', { text: g.adm2Name }),
        el('button', { class: 'x', title: 'Remove', text: '✕', onclick: () => {
          g.adm2 = null; g.adm2Props = []; state.drill = null; buildDataPanel(); buildFormatPanel(); render(); saveLocal(true);
        } })));
      const remap = () => { applyMapping(g.adm2, 2, g.mapping); render(); saveLocal(true); };
      g2.appendChild(mapRow(`${alias2()} join key`, g.adm2Props, g.mapping.adm2Pcode,
        (v) => { g.mapping.adm2Pcode = v; remap(); }));
      g2.appendChild(mapRow(`${alias2()} name`, g.adm2Props, g.mapping.adm2Name,
        (v) => { g.mapping.adm2Name = v; remap(); }));
      g2.appendChild(mapRow(`Parent ${alias1()} key`, g.adm2Props, g.mapping.adm2Parent,
        (v) => { g.mapping.adm2Parent = v; remap(); }));
      const orphans = g.adm2.features.filter((f) => !f.properties.ADM1_PCODE).length;
      if (orphans) g2.appendChild(el('div', { class: 'hint warn',
        text: `${orphans} Admin 2 features have no parent Admin 1 code — drill-down will skip them.` }));
    }
    panel.appendChild(g2);
  }

  /* ---- tabular data ---------------------------------------------------- */
  const gd = group('Data table', state.data.rows.length
    ? { text: `${state.data.rows.length} rows`, ok: true } : { text: 'optional' });
  if (!state.data.rows.length) {
    gd.appendChild(fileButton('Upload CSV / TSV / XLSX', '.csv,.tsv,.txt,.xlsx,.xlsm,.xlsb,.xls', loadDataFile));
    gd.appendChild(el('button', { class: 'tb-btn', style: 'width:100%;margin-top:6px;justify-content:center',
      text: 'Paste CSV / TSV text…', onclick: openPasteModal }));
  } else {
    gd.appendChild(el('div', { class: 'filename' }, el('span', { text: state.data.fileName }),
      el('button', { class: 'x', title: 'Remove', text: '✕', onclick: () => {
        state.data.rows = []; state.data.columns = []; state.data.fileName = '';
        state.data.roles = { adm1Key: '', adm2Key: '', colorValue: '', bubbleSize: '',
          glyphValues: [], labelValue2: '', labelText1: '', tooltips: [] };
        buildDataPanel(); render(); saveLocal(true);
      } })));
    const cols = state.data.columns;
    const table = el('table', { class: 'mini' });
    const head = el('tr');
    for (const c of cols.slice(0, 4)) head.appendChild(el('th', { text: c, title: c }));
    if (cols.length > 4) head.appendChild(el('th', { text: `+${cols.length - 4}` }));
    table.appendChild(head);
    for (const row of state.data.rows.slice(0, 3)) {
      const tr = el('tr');
      for (const c of cols.slice(0, 4)) tr.appendChild(el('td', { text: String(row[c] ?? ''), title: String(row[c] ?? '') }));
      if (cols.length > 4) tr.appendChild(el('td', { text: '…' }));
      table.appendChild(tr);
    }
    gd.appendChild(table);
  }
  panel.appendChild(gd);

  /* ---- role binding ---------------------------------------------------- */
  if (state.data.columns.length) {
    const gr = group('Field bindings');
    const cols = state.data.columns;
    const setRole = (role, v) => { state.data.roles[role] = v; buildDataPanel(); render(); saveLocal(); };
    const grid = el('div', { class: 'rolegrid' });
    const addRole = (label, role, hint) => {
      grid.appendChild(el('span', { html: `${esc(label)}${hint ? ` <code>${esc(hint)}</code>` : ''}` }));
      grid.appendChild(selectEl(cols, state.data.roles[role], (v) => setRole(role, v)));
    };
    addRole(`${alias1()} join column`, 'adm1Key');
    if (hasAdm2()) addRole(`${alias2()} join column`, 'adm2Key');
    addRole('Choropleth value', 'colorValue');
    addRole('Bubble size', 'bubbleSize');
    addRole('Label value 2', 'labelValue2');
    addRole('Label text 1 (name override)', 'labelText1');
    gr.appendChild(grid);

    gr.appendChild(el('div', { class: 'sub', text: 'Glyph values (pie / column series)' }));
    gr.appendChild(multiSelect(cols, state.data.roles.glyphValues, (v) => setRole('glyphValues', v)));
    gr.appendChild(el('div', { class: 'sub', text: 'Extra tooltip fields' }));
    gr.appendChild(multiSelect(cols, state.data.roles.tooltips, (v) => setRole('tooltips', v)));
    panel.appendChild(gr);
  }

  /* ---- join status ----------------------------------------------------- */
  const js = el('div', { class: 'joinstat none', id: 'joinStatus' });
  panel.appendChild(js);
  refreshJoinStatus();

  panel.appendChild(el('div', { class: 'hint', html:
    'Values join by the <b>link field</b> chosen in <i>Map setup</i> — the geometry\'s code column by default, ' +
    'or its name column for name-based joins. Matching ignores case, spaces, dashes and underscores.' }));
}

function multiSelect(columns, chosen, onChange) {
  const box = el('select', { multiple: true, size: Math.min(5, Math.max(3, columns.length)) });
  for (const c of columns) box.appendChild(el('option', { value: c, text: c, selected: chosen.includes(c) }));
  box.style.height = 'auto';
  box.addEventListener('change', () => onChange(Array.from(box.selectedOptions).map((o) => o.value)));
  return box;
}

function refreshJoinStatus() {
  const node = $('#joinStatus');
  if (!node) return;
  const s = state.joinStats;
  if (!s || !s.rows) {
    node.className = 'joinstat none';
    node.textContent = state.data.rows.length ? 'Bind a join column to colour the map.' : 'No data table loaded — geometry renders unstyled.';
    return;
  }
  const total = s.matched + s.unmatched;
  if (!total) { node.className = 'joinstat none'; node.textContent = 'No rows carried a join key.'; return; }
  const pct = Math.round((s.matched / total) * 100);
  if (s.matched === 0) {
    node.className = 'joinstat bad';
    node.textContent = `No rows matched the geometry. Data looks like: ${s.unmatchedSamples.join(', ')}. ` +
      'Check the join column and the link field.';
  } else if (s.unmatched) {
    node.className = 'joinstat bad';
    node.textContent = `${s.matched} of ${total} rows matched (${pct}%). Unmatched: ${s.unmatchedSamples.join(', ')}…`;
  } else {
    node.className = 'joinstat ok';
    node.textContent = `All ${s.matched} rows matched the geometry.`;
  }
}

function openPasteModal() {
  const ta = el('textarea', { rows: 12, placeholder: 'Paste CSV or TSV, including the header row…' });
  openModal('Paste table data', [ta], [
    ['Cancel', closeModal, false],
    ['Load', () => {
      try {
        const parsed = parseDelimitedText(ta.value, 'pasted text');
        closeModal();
        adoptData(parsed, 'Pasted data');
      } catch (e) { toast(e.message, true); }
    }, true]
  ]);
  setTimeout(() => ta.focus(), 40);
}

/* ============================================================ format UI ==== */

let undoStack = [], redoStack = [];
const snapshot = () => JSON.stringify(state.settings);

let lastUndoTag = '', lastUndoAt = 0;
/** `tag` identifies the control being edited. Dragging a colour picker or a
 *  slider fires dozens of input events; they are one edit, so reuse the
 *  snapshot taken when the control was first touched. */
function pushUndo(tag) {
  const now = performance.now();
  if (tag && tag === lastUndoTag && now - lastUndoAt < 1500) { lastUndoAt = now; return; }
  lastUndoTag = tag || '';
  lastUndoAt = now;
  undoStack.push(snapshot());
  if (undoStack.length > 60) undoStack.shift();
  redoStack.length = 0;
  refreshUndoButtons();
}
function refreshUndoButtons() {
  $('#btnUndo').disabled = !undoStack.length;
  $('#btnRedo').disabled = !redoStack.length;
}
function undo() {
  if (!undoStack.length) return;
  redoStack.push(snapshot());
  state.settings = JSON.parse(undoStack.pop());
  refreshUndoButtons(); buildFormatPanel(); render(); saveLocal();
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(snapshot());
  state.settings = JSON.parse(redoStack.pop());
  refreshUndoButtons(); buildFormatPanel(); render(); saveLocal();
}

function setSetting(cardKey, key, value, withUndo = true) {
  if (withUndo) pushUndo(`${cardKey}.${key}`);
  state.settings[cardKey][key] = value;
}

const openCards = new Set(['general', 'choropleth']);

function buildFormatPanel() {
  if (VIEW_ONLY) return;
  const panel = clear($('#panelFormat'));
  if (!hasGeometry()) {
    panel.appendChild(el('div', { class: 'hint', text: 'Upload geometry first — the formatting cards style what is on the map.' }));
  }
  CARDS.forEach((card, i) => {
    const wrap = el('div', { class: `card${openCards.has(card.key) ? ' open' : ''}`, 'data-card': card.key });
    const layerSlice = card.slices.find((s) => s.layer);
    const dot = layerSlice ? el('span', { class: `lyr-on${S()[card.key][layerSlice.k] ? ' on' : ''}` }) : null;
    const head = el('div', { class: 'head' },
      el('span', { class: 'n', text: String(i + 1) }),
      el('span', { class: 't', text: card.title }),
      dot,
      el('span', { class: 'chev', html: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>' }));
    head.addEventListener('click', () => {
      wrap.classList.toggle('open');
      if (wrap.classList.contains('open')) openCards.add(card.key); else openCards.delete(card.key);
    });
    const body = el('div', { class: 'body' });
    for (const slice of card.slices) body.appendChild(buildSliceRow(card.key, slice));
    wrap.append(head, body);
    panel.appendChild(wrap);
  });
  refreshSliceVisibility();
}

/**
 * Live preview while a control is being dragged. A trailing debounce would show
 * nothing until the pointer went still — a colour picker emits `input`
 * continuously — so coalesce to at most one render per animation frame instead.
 */
let framePending = false;
function liveRender() {
  if (framePending) return;
  framePending = true;
  requestAnimationFrame(() => { framePending = false; render(); });
}

/**
 * Settings whose entire effect is one attribute on nodes that are already
 * drawn. Patching those in place keeps a drag smooth on a heavy upload. Only
 * settings nothing else reads belong here — a border colour, for instance,
 * also feeds the Admin levels legend, so it takes the full render.
 */
const STYLE_ONLY = {
  'general.background': () => L.bg.setAttribute('fill',
    S().general.transparentBackground ? 'transparent' : S().general.background),
  'bubbles.opacity': () => patchAll(L.bubble, 'circle', 'fill-opacity', S().bubbles.opacity),
  'bubbles.strokeWidth': () => patchAll(L.bubble, 'circle', 'stroke-width', S().bubbles.strokeWidth),
  'glyphChart.opacity': () => patchAll(L.glyph, '*', 'fill-opacity', S().glyphChart.opacity),
  'glyphChart.stroke': () => patchAll(L.glyph, '*', 'stroke', S().glyphChart.stroke),
  'glyphChart.strokeWidth': () => patchAll(L.glyph, '*', 'stroke-width', S().glyphChart.strokeWidth)
};
function patchAll(layer, selector, attr, value) {
  for (const n of layer.querySelectorAll(selector)) n.setAttribute(attr, value);
}

function buildSliceRow(cardKey, slice) {
  const value = S()[cardKey][slice.k];
  const row = el('div', { class: 'row' });
  row.__when = slice.when;
  const ctl = el('div', { class: 'ctl' });
  const commit = (v) => {
    setSetting(cardKey, slice.k, v);
    refreshSliceVisibility();
    if (slice.layer) {
      const dot = $(`.card[data-card="${cardKey}"] .lyr-on`);
      if (dot) dot.classList.toggle('on', !!v);
    }
    const fast = STYLE_ONLY[`${cardKey}.${slice.k}`];
    if (fast) fast(); else liveRender();
    saveLocal();   // itself debounced, so this is cheap per keystroke
  };

  if (slice.type === 'info') {
    // Read-only row: the value comes from the schema, never from stored state.
    ctl.appendChild(slice.href
      ? el('a', { class: 'info', href: slice.href, target: '_blank', rel: 'noreferrer noopener', text: slice.d })
      : el('span', { class: 'info', text: slice.d }));
  } else if (slice.type === 'toggle') {
    const input = el('input', { type: 'checkbox' });
    input.checked = !!value;
    const sw = el('span', { class: `sw${value ? ' on' : ''}` }, input, el('i'));
    input.addEventListener('change', () => { sw.classList.toggle('on', input.checked); commit(input.checked); });
    ctl.appendChild(sw);
  } else if (slice.type === 'color') {
    const input = el('input', { type: 'color', value: value || '#000000' });
    input.addEventListener('input', () => commit(input.value));
    ctl.appendChild(input);
  } else if (slice.type === 'number') {
    const input = el('input', { type: 'number', value, min: slice.min, max: slice.max, step: slice.step ?? 1 });
    input.addEventListener('input', () => {
      const n = parseFloat(input.value);
      if (Number.isFinite(n)) commit(clamp(n, slice.min ?? -1e9, slice.max ?? 1e9));
    });
    ctl.appendChild(input);
  } else if (slice.type === 'text') {
    const input = el('input', { type: 'text', value: value || '', placeholder: slice.ph || '' });
    input.addEventListener('input', () => commit(input.value));
    ctl.appendChild(input);
  } else if (slice.type === 'select') {
    const opts = typeof slice.opts === 'function' ? slice.opts() : slice.opts;
    ctl.appendChild(selectEl(opts, value, (v) => commit(v), { allowNone: false }));
  }
  row.append(el('label', { text: slice.t }), ctl);
  if (slice.hint) row.title = slice.hint;
  return row;
}

function refreshSliceVisibility() {
  for (const row of $$('#panelFormat .row')) {
    if (!row.__when) continue;
    let visible = true;
    try { visible = !!row.__when(S()); } catch (e) { visible = true; }
    row.classList.toggle('hide', !visible);
  }
}

function applyTheme(name) {
  const theme = THEMES[name];
  if (!theme) return;
  pushUndo();
  for (const [cardKey, patch] of Object.entries(theme)) {
    for (const [k, v] of Object.entries(patch)) {
      if (cardKey === 'stateLabels') {
        // Typography choices propagate to all three label cards.
        for (const c of ['stateLabels', 'localityLabels', 'drillLabels']) {
          if (k === 'bold' && c !== 'stateLabels') continue;
          state.settings[c][k] = v;
        }
      } else if (state.settings[cardKey] && k in state.settings[cardKey]) {
        state.settings[cardKey][k] = v;
      }
    }
  }
  buildFormatPanel(); render(); saveLocal();
  toast(`Theme "${name}" applied`);
}
